<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Contributor</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #D4954B;
      --accent-hover: #E8A849;
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Loading --- */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* --- Profile Header --- */
    .profile-header {
      padding: 32px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #000;
      margin: 0 auto 12px;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-role {
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(212, 149, 75, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .profile-generation {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .profile-joined {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* --- Stats Cards --- */
    .stats-row {
      display: flex;
      gap: 12px;
      padding: 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stats-row::-webkit-scrollbar { display: none; }

    .stat-card {
      flex: 1;
      min-width: 90px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* --- Sections --- */
    .section {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* --- Genre Tags --- */
    .genre-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .genre-tag {
      display: inline-block;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(212, 149, 75, 0.1);
      color: var(--accent);
      cursor: pointer;
      transition: background 0.15s;
      min-height: 44px;
      line-height: 30px;
    }

    .genre-tag:hover {
      background: rgba(212, 149, 75, 0.25);
    }

    .genre-count {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* --- Playlists --- */
    .playlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: var(--radius-sm);
      transition: background 0.15s;
      min-height: 48px;
    }

    .playlist-item:hover {
      background: var(--surface-hover);
    }

    .playlist-name {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .playlist-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* --- Source Badges --- */
    .source-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-badge {
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      min-height: 44px;
      line-height: 30px;
    }

    /* --- Brands --- */
    .brand-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: var(--radius-sm);
      min-height: 48px;
    }

    .brand-name {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .brand-tracks {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* --- Not Found --- */
    .not-found {
      text-align: center;
      padding: 80px 20px;
    }

    .not-found h2 {
      margin-bottom: 8px;
    }

    .not-found p {
      color: var(--text-muted);
    }

    /* --- Genre Popup (reuse from catalog) --- */
    .genre-popup {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 20px 20px env(safe-area-inset-bottom, 20px);
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
    }

    .genre-popup.open { transform: translateY(0); }

    .genre-popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }

    .genre-popup-backdrop.open { display: block; }

    .genre-popup-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .genre-popup-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .genre-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: var(--radius-sm);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s;
      min-height: 48px;
    }

    .genre-link:hover { background: var(--surface-hover); }

    .genre-link-icon { width: 28px; text-align: center; font-size: 1.1rem; flex-shrink: 0; }

    .genre-link-info { flex: 1; }
    .genre-link-label { font-weight: 500; }
    .genre-link-desc { font-size: 0.75rem; color: var(--text-muted); }
    .genre-link::after { content: '↗'; font-size: 0.8rem; color: var(--text-muted); margin-left: auto; padding-left: 8px; }

    /* --- Bottom Nav --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 env(safe-area-inset-bottom, 10px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 16px;
      transition: color 0.2s;
    }

    .nav-item svg { width: 22px; height: 22px; }

    .content-wrap { padding-bottom: 80px; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- Loading State -->
  <div id="loading-view" class="loading" data-testid="loading-view">
    <div class="spinner"></div>
    <div class="loading-text" data-testid="loading-text">Loading profile...</div>
  </div>

  <!-- Not Found -->
  <div id="not-found" class="not-found hidden" data-testid="not-found">
    <h2>Contributor not found</h2>
    <p>This profile doesn't exist or has been removed.</p>
  </div>

  <!-- Profile View -->
  <div id="profile-view" class="hidden content-wrap" data-testid="profile-view">
    <div class="profile-header" data-testid="profile-header">
      <div class="profile-avatar" id="profile-avatar" data-testid="profile-avatar"></div>
      <div class="profile-name" id="profile-name" data-testid="profile-name"></div>
      <div id="profile-roles" data-testid="profile-roles"></div>
      <div class="profile-generation" id="profile-generation" data-testid="profile-generation"></div>
      <div class="profile-joined" id="profile-joined" data-testid="profile-joined"></div>
    </div>

    <div class="stats-row" data-testid="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-tracks" data-testid="stat-tracks">0</div>
        <div class="stat-label">Tracks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-playlists" data-testid="stat-playlists">0</div>
        <div class="stat-label">Playlists</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-brands" data-testid="stat-brands">0</div>
        <div class="stat-label">Brands</div>
      </div>
    </div>

    <div class="section" id="genres-section" data-testid="genres-section">
      <div class="section-title">Top Genres</div>
      <div class="genre-list" id="genre-list" data-testid="genre-list"></div>
    </div>

    <div class="section" id="playlists-section" data-testid="playlists-section">
      <div class="section-title">Playlists</div>
      <div id="playlist-list" data-testid="playlist-list"></div>
    </div>

    <div class="section hidden" id="portfolio-section" data-testid="portfolio-section">
      <div class="section-title">Preferred Playlists</div>
      <div id="portfolio-add" data-testid="portfolio-add" class="hidden" style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="url" id="portfolio-url" data-testid="portfolio-url" placeholder="Paste a Spotify playlist link"
          style="flex:1;min-height:44px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-family:var(--font);outline:none;">
        <button type="button" id="portfolio-add-btn" data-testid="portfolio-add-btn"
          style="min-height:44px;min-width:44px;padding:10px 18px;background:var(--accent);color:#000;border:none;border-radius:8px;font-size:16px;font-weight:600;font-family:var(--font);cursor:pointer;">Add</button>
      </div>
      <div id="portfolio-error" data-testid="portfolio-error" class="hidden" style="color:#e5484d;font-size:0.85rem;margin-bottom:10px;"></div>
      <div id="portfolio-list" data-testid="portfolio-list"></div>
    </div>

    <div class="section" id="attribution-section" class="hidden" data-testid="attribution-section">
      <div class="section-title">DJ Influence</div>
      <div id="attribution-stats" data-testid="attribution-stats" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;">
        <div style="font-size:0.85rem;color:var(--text-muted);">Attribution tracking coming soon</div>
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">QR scan at sets to track discoveries</div>
      </div>
    </div>

    <div class="section" id="sources-section" data-testid="sources-section">
      <div class="section-title">Sources</div>
      <div class="source-list" id="source-list" data-testid="source-list"></div>
    </div>

    <div class="section" id="brands-section" data-testid="brands-section">
      <div class="section-title">Communities</div>
      <div id="brand-list" data-testid="brand-list"></div>
    </div>

    <nav class="bottom-nav" id="bottom-nav" data-testid="bottom-nav">
      <a href="/catalog" class="nav-item" data-testid="nav-catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
        Catalog
      </a>
      <a href="/create" class="nav-item" data-testid="nav-create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Create
      </a>
      <a href="/import" class="nav-item" data-testid="nav-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        Import
      </a>
    </nav>
  </div>

  <!-- Genre Discovery Popup -->
  <div class="genre-popup-backdrop" id="genre-backdrop" data-testid="genre-backdrop"></div>
  <div class="genre-popup" id="genre-popup" data-testid="genre-popup">
    <div class="genre-popup-title" id="genre-popup-title"></div>
    <div class="genre-popup-links" id="genre-popup-links"></div>
  </div>

  <script>
    (function() {
      'use strict';

      // Add DJ dashboard link if viewer is a DJ
      fetch('/auth/session/me', { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok && data.contributor && data.contributor.role === 'dj') {
            var nav = document.getElementById('bottom-nav');
            var dashLink = document.createElement('a');
            dashLink.href = '/dashboard';
            dashLink.className = 'nav-item';
            dashLink.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"/></svg>Dashboard';
            nav.appendChild(dashLink);
          }
        })
        .catch(function() {});

      var contributorId = window.location.pathname.split('/contributor/')[1];
      if (!contributorId) {
        showNotFound();
        return;
      }

      loadProfile(contributorId);

      async function loadProfile(id) {
        try {
          var res = await fetch('/api/contributors/' + encodeURIComponent(id));
          var data = await res.json();

          if (!data.ok || !data.contributor) {
            showNotFound();
            return;
          }

          renderProfile(data);
          loadPortfolio(id);
        } catch (err) {
          console.error('[WKRP] Profile load error:', err);
          showNotFound();
        }
      }

      function renderProfile(data) {
        var c = data.contributor;

        document.title = c.name + ' — ourWKRP';

        document.getElementById('profile-avatar').textContent = c.name.charAt(0).toUpperCase();
        document.getElementById('profile-name').textContent = c.name;
        var roles = data.roles || [c.role];
        document.getElementById('profile-roles').innerHTML = roles.map(function(r) {
          return '<span class="profile-role">' + escapeHtml(r) + '</span>';
        }).join(' ');
        document.getElementById('profile-generation').textContent = c.generation;
        document.getElementById('profile-joined').textContent = 'Joined ' + formatDate(c.created_at);

        document.getElementById('stat-tracks').textContent = data.track_count || 0;
        document.getElementById('stat-playlists').textContent = data.playlist_count || 0;
        document.getElementById('stat-brands').textContent = (data.brands || []).length;

        // Genres
        var genreList = document.getElementById('genre-list');
        var genres = data.top_genres || [];
        if (genres.length === 0) {
          document.getElementById('genres-section').classList.add('hidden');
        } else {
          genreList.innerHTML = genres.map(function(g) {
            return '<span class="genre-tag" data-genre="' + escapeHtml(g.genre) + '" data-testid="genre-tag">' +
              escapeHtml(g.genre) + '<span class="genre-count">' + g.count + '</span></span>';
          }).join('');
        }

        // Playlists
        var playlistList = document.getElementById('playlist-list');
        var playlists = data.playlists || [];
        if (playlists.length === 0) {
          document.getElementById('playlists-section').classList.add('hidden');
        } else {
          playlistList.innerHTML = playlists.map(function(p) {
            return '<div class="playlist-item" data-testid="playlist-item">' +
              '<span class="playlist-name">' + escapeHtml(p.name) + '</span>' +
              '<span class="playlist-count">' + p.track_count + ' tracks</span>' +
              '</div>';
          }).join('');
        }

        // DJ Attribution section — only show for DJ role
        var roles = data.roles || [c.role];
        var isDJ = roles.indexOf('dj') !== -1;
        if (!isDJ) {
          document.getElementById('attribution-section').classList.add('hidden');
        }

        // Sources
        var sourceList = document.getElementById('source-list');
        var sources = data.contribution_sources || [];
        if (sources.length === 0) {
          document.getElementById('sources-section').classList.add('hidden');
        } else {
          sourceList.innerHTML = sources.map(function(s) {
            return '<span class="source-badge" data-testid="source-badge">' + escapeHtml(s) + '</span>';
          }).join('');
        }

        // Brands
        var brandListEl = document.getElementById('brand-list');
        var brands = data.brands || [];
        if (brands.length === 0) {
          document.getElementById('brands-section').classList.add('hidden');
        } else {
          brandListEl.innerHTML = brands.map(function(b) {
            return '<div class="brand-item" data-testid="brand-item">' +
              '<span class="brand-name">' + escapeHtml(b.name) + '</span>' +
              '<span class="brand-tracks">' + b.track_count + ' tracks</span>' +
              '</div>';
          }).join('');
        }

        document.getElementById('loading-view').classList.add('hidden');
        document.getElementById('profile-view').classList.remove('hidden');
      }

      function showNotFound() {
        document.getElementById('loading-view').classList.add('hidden');
        document.getElementById('not-found').classList.remove('hidden');
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
          var d = new Date(dateStr);
          return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        } catch (e) {
          return dateStr;
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // --- Preferred Playlists portfolio ---
      async function loadPortfolio(id) {
        var isOwner = false;
        try {
          var sres = await fetch('/auth/session/me', { credentials: 'same-origin' });
          var sdata = await sres.json();
          isOwner = !!(sdata.ok && sdata.contributor && sdata.contributor.id === id);
        } catch (e) { /* anonymous viewer */ }

        var playlists = [];
        try {
          var pres = await fetch('/api/contributors/' + encodeURIComponent(id) + '/portfolio');
          var pdata = await pres.json();
          if (pdata.ok) playlists = pdata.playlists || [];
        } catch (e) { /* leave empty */ }

        // A visitor with nothing to see doesn't get an empty section.
        if (!isOwner && playlists.length === 0) return;

        document.getElementById('portfolio-section').classList.remove('hidden');
        renderPortfolio(playlists, isOwner);

        if (isOwner) {
          document.getElementById('portfolio-add').classList.remove('hidden');
          document.getElementById('portfolio-add-btn').addEventListener('click', function() {
            addPortfolioPlaylist(id, isOwner);
          });
        }
      }

      function renderPortfolio(playlists, isOwner) {
        var list = document.getElementById('portfolio-list');
        if (playlists.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">No playlists yet — paste a Spotify playlist link above to start your portfolio.</div>';
          return;
        }
        list.innerHTML = playlists.map(function(p) {
          var remove = isOwner
            ? '<button type="button" class="portfolio-remove" data-id="' + escapeHtml(p.id) + '" data-testid="portfolio-remove" style="margin-top:6px;min-height:44px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:0.85rem;font-family:var(--font);cursor:pointer;">Remove</button>'
            : '';
          return '<div class="portfolio-item" data-testid="portfolio-item" style="margin-bottom:16px;">' +
            '<iframe data-testid="portfolio-embed" src="' + escapeHtml(p.embed_url) + '" width="100%" height="152" frameborder="0" loading="lazy" allow="encrypted-media" style="border-radius:12px;"></iframe>' +
            remove +
            '</div>';
        }).join('');
      }

      async function addPortfolioPlaylist(id, isOwner) {
        var input = document.getElementById('portfolio-url');
        var btn = document.getElementById('portfolio-add-btn');
        var url = input.value.trim();
        hidePortfolioError();
        if (!url) { showPortfolioError('Paste a Spotify playlist link.'); return; }
        btn.disabled = true;
        try {
          var res = await fetch('/api/portfolio', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ url: url }),
          });
          var data = await res.json();
          if (!data.ok) { showPortfolioError(data.error || 'Could not add that playlist.'); btn.disabled = false; return; }
          input.value = '';
          var pres = await fetch('/api/contributors/' + encodeURIComponent(id) + '/portfolio');
          var pdata = await pres.json();
          renderPortfolio(pdata.ok ? (pdata.playlists || []) : [], isOwner);
        } catch (e) {
          showPortfolioError('Something went wrong. Please try again.');
        }
        btn.disabled = false;
      }

      function showPortfolioError(msg) {
        var el = document.getElementById('portfolio-error');
        el.textContent = msg;
        el.classList.remove('hidden');
      }

      function hidePortfolioError() {
        document.getElementById('portfolio-error').classList.add('hidden');
      }

      document.getElementById('portfolio-list').addEventListener('click', async function(e) {
        var btn = e.target.closest('.portfolio-remove');
        if (!btn) return;
        var item = btn.closest('.portfolio-item');
        try {
          await fetch('/api/portfolio/' + encodeURIComponent(btn.dataset.id), {
            method: 'DELETE', credentials: 'same-origin',
          });
          if (item) item.remove();
        } catch (e) { /* ignore */ }
      });

      // --- Genre Discovery Popup ---
      var genrePopup = document.getElementById('genre-popup');
      var genreBackdrop = document.getElementById('genre-backdrop');
      var genrePopupTitle = document.getElementById('genre-popup-title');
      var genrePopupLinks = document.getElementById('genre-popup-links');

      function openGenrePopup(genre) {
        var slug = genre.toLowerCase().replace(/\s+/g, '+');
        var slugDash = genre.toLowerCase().replace(/\s+/g, '-');

        genrePopupTitle.textContent = genre;
        genrePopupLinks.innerHTML =
          '<a href="https://www.discogs.com/search/?genre_exact=' + encodeURIComponent(genre) + '" target="_blank" rel="noopener" class="genre-link" data-testid="genre-link-discogs">' +
            '<span class="genre-link-icon">&#x1F4BF;</span>' +
            '<div class="genre-link-info"><div class="genre-link-label">Discogs</div><div class="genre-link-desc">Labels, pressings, vinyl</div></div>' +
          '</a>' +
          '<a href="https://www.last.fm/tag/' + encodeURIComponent(slug) + '" target="_blank" rel="noopener" class="genre-link" data-testid="genre-link-lastfm">' +
            '<span class="genre-link-icon">&#x1F3B6;</span>' +
            '<div class="genre-link-info"><div class="genre-link-label">Last.fm</div><div class="genre-link-desc">Community tags, related artists</div></div>' +
          '</a>' +
          '<a href="https://everynoise.com/engenremap-' + encodeURIComponent(slugDash) + '.html" target="_blank" rel="noopener" class="genre-link" data-testid="genre-link-everynoise">' +
            '<span class="genre-link-icon">&#x1F30D;</span>' +
            '<div class="genre-link-info"><div class="genre-link-label">Every Noise</div><div class="genre-link-desc">Visual genre map</div></div>' +
          '</a>';

        genrePopup.classList.add('open');
        genreBackdrop.classList.add('open');
      }

      function closeGenrePopup() {
        genrePopup.classList.remove('open');
        genreBackdrop.classList.remove('open');
      }

      genreBackdrop.addEventListener('click', closeGenrePopup);

      // Delegate genre tag clicks
      document.getElementById('genre-list').addEventListener('click', function(e) {
        var tag = e.target.closest('.genre-tag');
        if (tag) {
          e.stopPropagation();
          openGenrePopup(tag.dataset.genre);
        }
      });
    })();
  </script>
</body>
</html>
