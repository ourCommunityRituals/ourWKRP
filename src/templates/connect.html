<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #D4954B;
      --accent-hover: #E8A849;
      --error: #e74c3c;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 400px; }

    .logo { text-align: center; margin-bottom: 40px; }
    .logo h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    .logo p { color: var(--text-muted); margin-top: 8px; font-size: 0.875rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }

    .actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 52px;
      touch-action: manipulation;
      font-family: var(--font);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #1a1a1a; }

    .spotify {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .spotify-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 8px 4px;
      font-family: var(--font);
      text-decoration: underline;
      text-underline-offset: 3px;
      min-height: 44px;
    }
    .spotify-link:hover { color: var(--text); }
    .spotify-link:disabled { opacity: 0.5; cursor: not-allowed; }
    .spotify-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      opacity: 0.7;
    }

    .error-banner {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }
    .error-banner.visible { display: block; }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    @media (max-width: 390px) {
      body { padding: 16px; }
      .logo h1 { font-size: 1.75rem; }
      .logo { margin-bottom: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>ourWKRP</h1>
      <p>The human answer to AI playlists.<br>Real people. Real taste. No algorithm.</p>
    </div>

    <div id="error-banner" class="error-banner" data-testid="error-banner"></div>

    <form id="connect-form" data-testid="connect-form" autocomplete="off" novalidate>
      <label for="name">What's your name?</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="e.g. Matt"
        maxlength="100"
        autocomplete="name"
        autofocus
        data-testid="input-name"
      >

      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-bring" data-testid="btn-bring">
          Bring Your Music
        </button>
        <a href="/catalog" class="btn btn-secondary" id="btn-browse" data-testid="btn-browse">
          Browse the Catalog
        </a>
      </div>

      <div class="spotify">
        <button type="button" class="spotify-link" id="btn-connect" data-testid="btn-connect">
          Or connect with Spotify
        </button>
        <div class="spotify-note">5 seats available</div>
      </div>
    </form>

    <div class="footer">
      <p>ourCommunityRituals</p>
    </div>
  </div>

  <script nonce="__CSP_NONCE__">
    (function() {
      'use strict';

      var form = document.getElementById('connect-form');
      var errorBanner = document.getElementById('error-banner');
      var nameInput = document.getElementById('name');
      var btnBring = document.getElementById('btn-bring');
      var btnBrowse = document.getElementById('btn-browse');
      var btnConnect = document.getElementById('btn-connect');

      // Surface error param from URL (after a failed OAuth round-trip)
      var params = new URLSearchParams(window.location.search);
      var err = params.get('error');
      if (err) {
        var messages = {
          'spotify_denied': 'Spotify access was denied. Please try again.',
          'invalid_callback': 'Authentication failed. Please try again.',
          'invalid_state': 'Session expired. Please try again.',
          'auth_failed': 'Authentication failed. Please try again.',
        };
        showError(messages[err] || 'Something went wrong. Please try again.');
        window.history.replaceState({}, '', '/');
      }

      // If already signed in, jump straight to the catalog. 401 = silent (not signed in).
      fetch('/auth/session/me', { credentials: 'same-origin' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data && data.ok && data.contributor) {
            window.location.href = '/catalog';
          }
        })
        .catch(function() { /* network hiccup — stay on the page */ });

      // Browse — always available, no name required.
      btnBrowse.addEventListener('click', function(e) {
        // If they entered a name, register so their contributions can be attributed later.
        var name = nameInput.value.trim();
        if (name) {
          e.preventDefault();
          register(name).then(function() { window.location.href = '/catalog'; });
        }
        // Otherwise the <a href> handles navigation natively.
      });

      // Bring Your Music — requires a name, registers, lands on /import.
      btnBring.addEventListener('click', function() {
        var name = nameInput.value.trim();
        if (!name) {
          showError('Please enter your name first.');
          nameInput.focus();
          return;
        }
        setBusy(true);
        register(name)
          .then(function(data) {
            if (data && data.ok) {
              window.location.href = '/import';
            } else {
              setBusy(false);
              showError((data && data.error) || 'Could not sign you in. Please try again.');
            }
          })
          .catch(function() {
            setBusy(false);
            showError('Something went wrong. Please try again.');
          });
      });

      // Spotify — requires a name (Spotify needs it for the contributor record).
      btnConnect.addEventListener('click', function() {
        var name = nameInput.value.trim();
        if (!name) {
          showError('Please enter your name first.');
          nameInput.focus();
          return;
        }
        setBusy(true);
        btnConnect.textContent = 'Connecting...';
        // gen=founder is a sensible default; can be edited on the profile later.
        var q = new URLSearchParams({ name: name, gen: 'founder' });
        window.location.href = '/auth/start?' + q.toString();
      });

      // Form submit (e.g. Enter key) defaults to Bring Your Music.
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        btnBring.click();
      });

      function register(name) {
        return fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ name: name }),
        }).then(function(r) { return r.json(); });
      }

      function setBusy(busy) {
        btnBring.disabled = busy;
        btnConnect.disabled = busy;
        btnBrowse.style.pointerEvents = busy ? 'none' : '';
        btnBrowse.style.opacity = busy ? '0.6' : '';
        if (busy) btnBring.textContent = 'One moment...';
        else btnBring.textContent = 'Bring Your Music';
      }

      function showError(message) {
        errorBanner.textContent = message;
        errorBanner.classList.add('visible');
      }
    })();
  </script>
</body>
</html>
