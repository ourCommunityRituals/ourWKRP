<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Create Playlist</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #1DB954;
      --accent-hover: #1ed760;
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .content {
      padding: 24px 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-muted);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .range-group label {
      font-size: 0.875rem;
      color: var(--text-muted);
      min-width: 100px;
    }

    .range-group input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .range-value {
      font-size: 0.875rem;
      color: var(--text);
      min-width: 40px;
      text-align: right;
    }

    .preview-count {
      text-align: center;
      padding: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .preview-count strong {
      color: var(--accent);
      font-size: 1.5rem;
      display: block;
      margin-bottom: 4px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 52px;
      touch-action: manipulation;
    }

    .btn:active { transform: scale(0.98); }

    .btn-create {
      background: var(--accent);
      color: #000;
      margin-top: 8px;
    }

    .btn-create:hover { background: var(--accent-hover); }
    .btn-create:disabled { opacity: 0.5; cursor: not-allowed; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .toggle-label {
      font-size: 0.9rem;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--accent);
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(20px);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 env(safe-area-inset-bottom, 10px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 16px;
    }

    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Create Playlist</h1>
  </div>

  <div class="content">
    <form id="create-form" data-testid="create-form">
      <div class="section">
        <div class="section-title">Playlist Details</div>
        <input
          type="text"
          id="playlist-name"
          placeholder="Playlist name"
          required
          maxlength="100"
          data-testid="input-playlist-name"
          style="margin-bottom: 12px;"
        >
        <textarea
          id="playlist-desc"
          placeholder="Description (optional)"
          maxlength="300"
          data-testid="input-playlist-desc"
        ></textarea>
      </div>

      <div class="section">
        <div class="section-title">Filter by Audio Features</div>
        <div class="range-group">
          <label>Min Energy</label>
          <input type="range" id="min-energy" min="0" max="100" value="0" data-testid="create-range-energy">
          <span class="range-value" id="min-energy-val">0</span>
        </div>
        <div class="range-group">
          <label>Min Mood</label>
          <input type="range" id="min-valence" min="0" max="100" value="0" data-testid="create-range-valence">
          <span class="range-value" id="min-valence-val">0</span>
        </div>
        <div class="range-group">
          <label>Min Dance</label>
          <input type="range" id="min-dance" min="0" max="100" value="0" data-testid="create-range-dance">
          <span class="range-value" id="min-dance-val">0</span>
        </div>
        <div class="range-group">
          <label>Min Tempo</label>
          <input type="range" id="min-tempo" min="60" max="200" value="60" data-testid="create-range-tempo">
          <span class="range-value" id="min-tempo-val">60</span>
        </div>
      </div>

      <div class="section">
        <div class="preview-count" data-testid="preview-count">
          <strong id="match-count">--</strong>
          matching tracks
        </div>
      </div>

      <div class="section">
        <div class="toggle-row">
          <span class="toggle-label">Make playlist public</span>
          <label class="toggle">
            <input type="checkbox" id="is-public" checked data-testid="toggle-public">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-create" id="create-btn" data-testid="btn-create">
        Create on Spotify
      </button>
    </form>
  </div>

  <nav class="bottom-nav">
    <a href="/catalog" class="nav-item" data-testid="nav-catalog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>
      Catalog
    </a>
    <a href="/create" class="nav-item active" data-testid="nav-create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Create
    </a>
  </nav>

  <script>
    (function() {
      'use strict';

      var session = localStorage.getItem('wkrp_session');
      if (!session) {
        window.location.href = '/';
        return;
      }

      // Range slider value updates
      ['energy', 'valence', 'dance', 'tempo'].forEach(function(name) {
        var range = document.getElementById('min-' + name);
        var value = document.getElementById('min-' + name + '-val');
        if (range && value) {
          range.addEventListener('input', function() {
            value.textContent = this.value;
            console.log('[WKRP] Create filter:', name, this.value);
          });
        }
      });

      document.getElementById('create-form').addEventListener('submit', function(e) {
        e.preventDefault();

        var name = document.getElementById('playlist-name').value.trim();
        if (!name) return;

        var btn = document.getElementById('create-btn');
        btn.disabled = true;
        btn.textContent = 'Creating...';

        console.log('[WKRP] Creating playlist:', {
          name: name,
          desc: document.getElementById('playlist-desc').value,
          energy: document.getElementById('min-energy').value,
          valence: document.getElementById('min-valence').value,
          dance: document.getElementById('min-dance').value,
          tempo: document.getElementById('min-tempo').value,
          public: document.getElementById('is-public').checked,
        });

        // Playlist creation will call /spotify/create-playlist/:userId
        // For MVP, log the intent
        setTimeout(function() {
          btn.textContent = 'Create on Spotify';
          btn.disabled = false;
          alert('Playlist creation will be wired to the Spotify API in the next iteration.');
        }, 1000);
      });
    })();
  </script>
</body>
</html>
