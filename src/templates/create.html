<!DOCTYPE html>
<html lang="en" data-brand="ow">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Create Playlist</title>
  <link rel="stylesheet" href="/ui.css">
  <style>.content{padding:24px 20px 100px;max-width:500px;margin:0 auto}#create-btn{margin-top:8px}.export-row{display:flex;gap:8px;margin-top:16px}.export-row .btn{flex:1}.stat-chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.stat-chips .detail-chip{white-space:nowrap;flex-shrink:0}</style>
</head>
<body>
  <div class="header">
    <h1>Create Playlist</h1>
  </div>

  <div class="content">
    <form id="create-form" data-testid="create-form">
      <div class="section">
        <div class="section-title">Playlist Details</div>
        <input
          type="text"
          id="playlist-name"
          placeholder="Playlist name"
          required
          maxlength="100"
          data-testid="input-playlist-name"
          class="input"
          style="margin-bottom: 12px;"
        >
        <textarea
          id="playlist-desc"
          placeholder="Description (optional)"
          maxlength="300"
          data-testid="input-playlist-desc"
          class="input"
        ></textarea>
      </div>

      <!-- Audio-feature sliders stay hidden until /api/stats reports
           has_audio_features — with no features they filter nothing. -->
      <div class="section" id="audio-feature-section" data-testid="audio-feature-section" hidden>
        <div class="section-title">Filter by Audio Features</div>
        <div class="range-group">
          <label>Min Energy</label>
          <input type="range" id="min-energy" min="0" max="100" value="0" data-testid="create-range-energy">
          <span class="range-value" id="min-energy-val">0</span>
        </div>
        <div class="range-group">
          <label>Min Mood</label>
          <input type="range" id="min-valence" min="0" max="100" value="0" data-testid="create-range-valence">
          <span class="range-value" id="min-valence-val">0</span>
        </div>
        <div class="range-group">
          <label>Min Dance</label>
          <input type="range" id="min-dance" min="0" max="100" value="0" data-testid="create-range-dance">
          <span class="range-value" id="min-dance-val">0</span>
        </div>
        <div class="range-group">
          <label>Min Tempo</label>
          <input type="range" id="min-tempo" min="60" max="200" value="60" data-testid="create-range-tempo">
          <span class="range-value" id="min-tempo-val">60</span>
        </div>
      </div>

      <div class="section">
        <div class="preview-count" data-testid="preview-count">
          <strong id="match-count">--</strong>
          matching tracks
        </div>
      </div>

      <div class="section">
        <div class="toggle-row">
          <span class="toggle-label">Make playlist public</span>
          <label class="toggle">
            <input type="checkbox" id="is-public" checked data-testid="toggle-public">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="create-btn" data-testid="btn-create">
        Create Playlist
      </button>
    </form>

    <!-- Track search + add (shown after playlist created) -->
    <div id="track-add-section" class="section" style="display:none;" data-testid="track-add-section">
      <div class="section-title">Add Tracks</div>
      <input type="text" id="track-search" placeholder="Search tracks to add..." data-testid="track-search" class="input" style="margin-bottom:12px;">
      <div id="search-results" data-testid="search-results"></div>
    </div>

    <!-- Playlist track list -->
    <div id="playlist-tracks-section" class="section" style="display:none;" data-testid="playlist-tracks-section">
      <div class="section-title">Playlist Tracks (<span id="playlist-track-count">0</span>)</div>

      <!-- Playlist stats mini-bar -->
      <div id="playlist-stats" class="stat-chips" data-testid="playlist-stats"></div>

      <!-- Filter within playlist -->
      <input type="text" id="playlist-filter" placeholder="Filter this playlist..." data-testid="playlist-filter" class="input" style="margin-bottom:12px;">

      <div id="playlist-track-list" data-testid="playlist-track-list"></div>

      <div class="export-row">
        <button class="btn btn-primary" id="export-btn" data-testid="export-btn">
          Export for Apple Music
        </button>
        <button class="btn btn-secondary" id="export-csv-btn" data-testid="export-csv-btn">
          Export CSV
        </button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/catalog" class="nav-item" data-testid="nav-catalog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
      Catalog
    </a>
    <a href="/create" class="nav-item active" data-testid="nav-create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Create
    </a>
    <a href="/import" class="nav-item" data-testid="nav-import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      Import
    </a>
  </nav>

  <script nonce="__CSP_NONCE__">
    (function() {
      'use strict';

      var playlistId = null;

      // Auth + role check via cookie
      fetch('/auth/session/me', { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.ok) {
            // Humane gate for unauthenticated users — render a stable sign-in
            // surface instead of a hard redirect (which races the page smoke
            // and violates the "never a blank page / redirect" gate principle).
            document.querySelector('.content').innerHTML =
              '<div class="access-denied" data-testid="connect-gate" style="text-align:center;padding:60px 20px;">' +
              '<h3>Connect to create playlists</h3>' +
              '<p style="color:var(--text-muted);margin-top:8px;">Sign in with Spotify to build and save playlists.</p>' +
              '<a href="/" class="btn btn-primary" data-testid="connect-cta" style="margin-top:20px;">Connect with Spotify</a></div>';
            return;
          }
          var allowed = ['founder', 'curator', 'dj'];
          if (!allowed.includes(data.contributor.role)) {
            document.querySelector('.content').innerHTML =
              '<div style="text-align:center;padding:60px 20px;">' +
              '<h3>Create Restricted</h3>' +
              '<p style="color:var(--text-muted);margin-top:8px;">DJs and Curators can create playlists.</p>' +
              '<a href="/catalog" style="color:var(--accent);text-decoration:none;display:block;margin-top:20px;">Browse the catalog</a></div>';
          }
        })
        .catch(function() { window.location.href = '/'; });

      // Audio-feature gate: Spotify refuses /audio-features to newer apps, so
      // a catalog can hold zero features. The sliders only appear when there
      // is something for them to filter on.
      fetch('/api/stats')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var section = document.getElementById('audio-feature-section');
          if (section && data.ok && data.stats.has_audio_features === true) {
            section.hidden = false;
          }
        })
        .catch(function() {});

      // Range slider value updates
      ['energy', 'valence', 'dance', 'tempo'].forEach(function(name) {
        var range = document.getElementById('min-' + name);
        var value = document.getElementById('min-' + name + '-val');
        if (range && value) {
          range.addEventListener('input', function() {
            value.textContent = this.value;
          });
        }
      });

      // Create playlist
      document.getElementById('create-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        var name = document.getElementById('playlist-name').value.trim();
        if (!name) return;

        var btn = document.getElementById('create-btn');
        btn.disabled = true;
        btn.textContent = 'Creating...';

        try {
          var res = await fetch('/api/playlists', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              name: name,
              description: document.getElementById('playlist-desc').value.trim() || null,
            }),
          });
          var data = await res.json();

          if (!data.ok) {
            alert(data.error || 'Failed to create playlist');
            btn.disabled = false;
            btn.textContent = 'Create Playlist';
            return;
          }

          playlistId = data.playlist.id;
          btn.textContent = 'Playlist Created';

          // Show track add section
          document.getElementById('track-add-section').style.display = 'block';
          document.getElementById('playlist-tracks-section').style.display = 'block';
          document.getElementById('create-form').style.display = 'none';

        } catch (err) {
          console.error('[WKRP] Create error:', err);
          btn.disabled = false;
          btn.textContent = 'Create Playlist';
        }
      });

      // Track search
      var trackSearchInput = document.getElementById('track-search');
      var searchTimeout;
      if (trackSearchInput) {
        trackSearchInput.addEventListener('input', function() {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(async function() {
            var q = trackSearchInput.value.trim();
            if (q.length < 2) {
              document.getElementById('search-results').innerHTML = '';
              return;
            }
            try {
              var res = await fetch('/api/tracks?q=' + encodeURIComponent(q) + '&limit=10');
              var data = await res.json();
              if (data.ok) {
                renderSearchResults(data.tracks);
              }
            } catch (err) {
              console.error('[WKRP] Search error:', err);
            }
          }, 300);
        });
      }

      function renderSearchResults(tracks) {
        var container = document.getElementById('search-results');
        if (tracks.length === 0) {
          container.innerHTML = '<div style="color:var(--text-muted);padding:12px;text-align:center;">No tracks found</div>';
          return;
        }
        container.innerHTML = tracks.map(function(t) {
          return '<div class="search-result" ' +
            'data-track-id="' + escapeHtml(t.id) + '" data-testid="search-result">' +
            '<div class="track-info">' +
              '<div class="track-name">' + escapeHtml(t.name) + '</div>' +
              '<div class="track-artist">' + escapeHtml(t.artist) + '</div>' +
            '</div>' +
            '<button class="attr-btn" ' +
              'data-testid="add-track-btn">Add</button>' +
          '</div>';
        }).join('');

        // Add click handlers
        container.querySelectorAll('[data-track-id]').forEach(function(row) {
          row.querySelector('button').addEventListener('click', function(e) {
            e.stopPropagation();
            addTrackToPlaylist(row.dataset.trackId);
            row.querySelector('button').textContent = 'Added';
            row.querySelector('button').disabled = true;
            row.querySelector('button').style.opacity = '0.5';
          });
        });
      }

      async function addTrackToPlaylist(trackId) {
        if (!playlistId) return;
        try {
          await fetch('/api/playlists/' + playlistId + '/tracks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ track_ids: [trackId] }),
          });
          loadPlaylistTracks();
        } catch (err) {
          console.error('[WKRP] Add track error:', err);
        }
      }

      var playlistTracks = [];

      async function loadPlaylistTracks() {
        if (!playlistId) return;
        try {
          var res = await fetch('/api/playlists/' + playlistId);
          var data = await res.json();
          if (data.ok) {
            playlistTracks = data.playlist.tracks || [];
            document.getElementById('playlist-track-count').textContent = playlistTracks.length;
            renderPlaylistTracks(playlistTracks);
            renderPlaylistStats(playlistTracks);
          }
        } catch (err) {
          console.error('[WKRP] Load playlist error:', err);
        }
      }

      function renderPlaylistTracks(tracks) {
        var filter = (document.getElementById('playlist-filter').value || '').toLowerCase();
        var filtered = filter ? tracks.filter(function(t) {
          return (t.name || '').toLowerCase().includes(filter) ||
                 (t.artist || '').toLowerCase().includes(filter) ||
                 (t.genre || '').toLowerCase().includes(filter);
        }) : tracks;

        document.getElementById('playlist-track-list').innerHTML = filtered.map(function(t, i) {
          return '<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);" data-track-id="' + t.id + '">' +
            '<div style="font-size:0.7rem;color:var(--text-muted);min-width:20px;text-align:center;">' + (t.position + 1) + '</div>' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(t.name) + '</div>' +
              '<div style="font-size:0.7rem;color:var(--text-muted);">' + escapeHtml(t.artist) +
                (t.genre ? ' <span style="color:var(--accent);">' + escapeHtml(t.genre) + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<button data-action="remove" data-id="' + t.id + '" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:8px;min-height:44px;min-width:44px;" data-testid="remove-track-btn" title="Remove">&times;</button>' +
          '</div>';
        }).join('');

        // Remove handlers
        document.querySelectorAll('[data-action="remove"]').forEach(function(btn) {
          btn.addEventListener('click', function() { removeTrack(btn.dataset.id); });
        });
      }

      function renderPlaylistStats(tracks) {
        var genres = {};
        var decades = {};
        var totalEnergy = 0;
        var energyCount = 0;

        tracks.forEach(function(t) {
          if (t.genre) genres[t.genre] = (genres[t.genre] || 0) + 1;
          if (t.release_year) {
            var dec = Math.floor(t.release_year / 10) * 10 + 's';
            decades[dec] = (decades[dec] || 0) + 1;
          }
          if (t.energy !== null && t.energy !== undefined) {
            totalEnergy += t.energy;
            energyCount++;
          }
        });

        var topGenres = Object.entries(genres).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 4);
        var topDecades = Object.entries(decades).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 3);
        var avgEnergy = energyCount > 0 ? Math.round((totalEnergy / energyCount) * 100) : null;

        var statsHtml = '';
        topGenres.forEach(function(g) {
          statsHtml += '<div class="detail-chip">' +
            '<span style="color:var(--accent);">' + escapeHtml(g[0]) + '</span> ' + g[1] + '</div>';
        });
        topDecades.forEach(function(d) {
          statsHtml += '<div class="detail-chip">' + d[0] + ' ' + d[1] + '</div>';
        });
        if (avgEnergy !== null) {
          statsHtml += '<div class="detail-chip">' +
            'Energy ' + avgEnergy + '</div>';
        }

        document.getElementById('playlist-stats').innerHTML = statsHtml || '<div style="font-size:0.7rem;color:var(--text-muted);">Add tracks to see stats</div>';
      }

      async function removeTrack(trackId) {
        if (!playlistId) return;
        try {
          await fetch('/api/playlists/' + playlistId + '/tracks', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ track_ids: [trackId] }),
          });
          loadPlaylistTracks();
        } catch (err) {
          console.error('[WKRP] Remove track error:', err);
        }
      }

      // Filter within playlist
      document.getElementById('playlist-filter').addEventListener('input', function() {
        renderPlaylistTracks(playlistTracks);
      });

      // Export
      document.getElementById('export-btn').addEventListener('click', async function() {
        if (!playlistId) return;
        try {
          var res = await fetch('/api/playlists/' + playlistId + '/export');
          var data = await res.json();
          if (data.ok) {
            var blob = new Blob([JSON.stringify(data.export, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = (data.export.playlist_name || 'playlist') + '.json';
            a.click();
            URL.revokeObjectURL(url);
          }
        } catch (err) {
          console.error('[WKRP] Export error:', err);
        }
      });

      // CSV export
      document.getElementById('export-csv-btn').addEventListener('click', function() {
        if (!playlistTracks.length) return;
        var header = 'position,name,artist,album,genre,isrc';
        var rows = playlistTracks.map(function(t, i) {
          return [i + 1, csvEsc(t.name), csvEsc(t.artist), csvEsc(t.album), csvEsc(t.genre), csvEsc(t.isrc)].join(',');
        });
        var csv = [header].concat(rows).join('\n');
        var blob = new Blob([csv], { type: 'text/csv' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'playlist.csv';
        a.click();
        URL.revokeObjectURL(url);
      });

      function csvEsc(v) {
        if (v === null || v === undefined) return '';
        var s = String(v);
        return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
