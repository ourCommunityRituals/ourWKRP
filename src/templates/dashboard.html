<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — DJ Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #D4954B;
      --accent-hover: #E8A849;
      --live: #ff4136;
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100dvh; -webkit-font-smoothing: antialiased; }

    .header { position: sticky; top: 0; z-index: 10; background: rgba(10,10,10,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .live-indicator { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 20px; }
    .live-indicator.on { color: var(--live); background: rgba(255,65,54,0.15); animation: pulse 2s ease-in-out infinite; }
    .live-indicator.off { color: var(--text-muted); background: var(--surface); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    .content { padding: 20px 20px 100px; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

    .stats-row { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
    .stats-row::-webkit-scrollbar { display: none; }
    .stat-card { flex: 1; min-width: 80px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }

    .set-controls { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn { padding: 14px 20px; border: none; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: var(--font); min-height: 48px; transition: opacity 0.2s; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #000; flex: 1; }
    .btn-danger { background: var(--live); color: #fff; flex: 1; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); flex: 1; }

    .venue-input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.85rem; font-family: var(--font); outline: none; margin-bottom: 10px; }
    .venue-input:focus { border-color: var(--accent); }
    .venue-input::placeholder { color: var(--text-muted); }

    .track-search { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.85rem; font-family: var(--font); outline: none; margin-bottom: 8px; }
    .track-search:focus { border-color: var(--accent); }
    .track-search::placeholder { color: var(--text-muted); }

    .search-result, .set-track, .timeline-item, .history-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm); min-height: 48px; }
    .search-result:hover, .history-item:hover { background: var(--surface-hover); }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 0.75rem; color: var(--text-muted); }
    .item-action { flex-shrink: 0; }

    .add-btn { background: var(--accent); color: #000; border: none; border-radius: 20px; padding: 6px 14px; font-size: 0.75rem; font-weight: 600; cursor: pointer; min-height: 44px; }
    .add-btn:disabled { opacity: 0.4; }

    .poster-link { display: block; text-align: center; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500; margin-top: 12px; min-height: 48px; line-height: 20px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 env(safe-area-inset-bottom, 10px); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.65rem; color: var(--text-muted); text-decoration: none; padding: 6px 16px; }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 20px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .access-denied { text-align: center; padding: 60px 20px; }
    .access-denied h3 { margin-bottom: 8px; }
    .access-denied p { color: var(--text-muted); }
  </style>
</head>
<body>
  <div id="loading-view" class="loading" data-testid="loading-view"><div class="spinner"></div></div>
  <div id="access-denied" class="access-denied hidden" data-testid="access-denied">
    <h3>DJ Dashboard</h3>
    <p>Only DJs can access this page.</p>
  </div>

  <div id="dashboard-view" class="hidden" data-testid="dashboard-view">
    <div class="header">
      <h1>DJ Dashboard</h1>
      <span class="live-indicator off" id="live-indicator" data-testid="live-indicator">Offline</span>
    </div>

    <div class="content">
      <!-- Influence Stats -->
      <div class="stats-row" data-testid="stats-row">
        <div class="stat-card"><div class="stat-value" id="stat-attributions">0</div><div class="stat-label">Attributions</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-listeners">0</div><div class="stat-label">Listeners</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-sets">0</div><div class="stat-label">Sets</div></div>
      </div>

      <!-- Set Controls -->
      <div class="section" data-testid="set-controls-section">
        <div class="section-title">Live Set</div>
        <input type="text" class="venue-input" id="venue-input" placeholder="Venue name (optional)" data-testid="venue-input">
        <div class="set-controls">
          <button class="btn btn-primary" id="start-set-btn" data-testid="start-set-btn">Start Set</button>
          <button class="btn btn-danger hidden" id="end-set-btn" data-testid="end-set-btn">End Set</button>
        </div>
        <a class="poster-link hidden" id="poster-link" data-testid="poster-link" target="_blank">Open Poster (for venue display)</a>
      </div>

      <!-- Add Track to Set -->
      <div class="section hidden" id="add-track-section" data-testid="add-track-section">
        <div class="section-title">Add Track to Set</div>
        <input type="text" class="track-search" id="set-track-search" placeholder="Search tracks..." data-testid="set-track-search">
        <div id="set-search-results" data-testid="set-search-results"></div>
        <div class="section-title" style="margin-top:16px;">Current Set</div>
        <div id="current-set-tracks" data-testid="current-set-tracks"></div>
      </div>

      <!-- Top Discovered Tracks -->
      <div class="section" data-testid="top-tracks-section">
        <div class="section-title">Top Discovered Tracks</div>
        <div id="top-tracks" data-testid="top-tracks"></div>
      </div>

      <!-- Set History -->
      <div class="section" data-testid="set-history-section">
        <div class="section-title">Set History</div>
        <div id="set-history" data-testid="set-history"></div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="/catalog" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>Catalog</a>
      <a href="/dashboard" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"/></svg>Dashboard</a>
      <a href="/create" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Create</a>
    </nav>
  </div>

  <script>
    (function() {
      'use strict';
      var contributor = null;
      var liveSetId = null;

      init();

      async function init() {
        try {
          var res = await fetch('/auth/session/me', { credentials: 'same-origin' });
          var data = await res.json();
          if (!data.ok) { window.location.href = '/'; return; }
          contributor = data.contributor;
          if (contributor.role !== 'dj') {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('access-denied').classList.remove('hidden');
            return;
          }
          await Promise.all([loadStats(), checkLiveSet()]);
          await loadSetHistory();
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('dashboard-view').classList.remove('hidden');
        } catch (e) {
          console.error('[WKRP] Dashboard error:', e);
          window.location.href = '/';
        }
      }

      async function loadStats() {
        try {
          var res = await fetch('/dj/' + contributor.id + '/stats');
          var data = await res.json();
          if (data.ok) {
            document.getElementById('stat-attributions').textContent = data.stats.total_attributions;
            document.getElementById('stat-listeners').textContent = data.stats.unique_listeners;
            document.getElementById('stat-sets').textContent = data.stats.total_sets;
            renderTopTracks(data.stats.top_discovered_tracks || []);
          }
        } catch (e) { console.error('[WKRP] Stats error:', e); }
      }

      function renderTopTracks(tracks) {
        var el = document.getElementById('top-tracks');
        if (tracks.length === 0) { el.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">No attributions yet. Start a set and share your poster.</div>'; return; }
        el.innerHTML = tracks.map(function(t) {
          return '<div class="set-track"><div class="item-info"><div class="item-name">' + esc(t.name) + '</div><div class="item-sub">' + esc(t.artist) + '</div></div><div class="item-action" style="font-size:0.8rem;color:var(--accent);">' + t.attribution_count + '</div></div>';
        }).join('');
      }

      async function checkLiveSet() {
        try {
          var res = await fetch('/dj/' + contributor.id + '/live');
          var data = await res.json();
          if (data.ok && data.live_set) {
            liveSetId = data.live_set.id;
            setLiveState(true, data.live_set.venue_name);
            renderSetTracks(data.live_set.tracks || []);
          }
        } catch (e) {}
      }

      function setLiveState(isLive, venue) {
        var indicator = document.getElementById('live-indicator');
        var startBtn = document.getElementById('start-set-btn');
        var endBtn = document.getElementById('end-set-btn');
        var addSection = document.getElementById('add-track-section');
        var posterLink = document.getElementById('poster-link');
        var venueInput = document.getElementById('venue-input');
        if (isLive) {
          indicator.textContent = 'Live';
          indicator.className = 'live-indicator on';
          startBtn.classList.add('hidden');
          endBtn.classList.remove('hidden');
          addSection.classList.remove('hidden');
          posterLink.classList.remove('hidden');
          posterLink.href = '/dj/' + contributor.id + '/poster';
          venueInput.disabled = true;
          if (venue) venueInput.value = venue;
        } else {
          indicator.textContent = 'Offline';
          indicator.className = 'live-indicator off';
          startBtn.classList.remove('hidden');
          endBtn.classList.add('hidden');
          addSection.classList.add('hidden');
          posterLink.classList.add('hidden');
          venueInput.disabled = false;
        }
      }

      // Start set
      document.getElementById('start-set-btn').addEventListener('click', async function() {
        var btn = this; btn.disabled = true;
        try {
          var res = await fetch('/api/sets', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
            body: JSON.stringify({ venue_name: document.getElementById('venue-input').value.trim() || null }),
          });
          var data = await res.json();
          if (data.ok) { liveSetId = data.set.id; setLiveState(true, data.set.venue_name); }
        } catch (e) { console.error(e); }
        btn.disabled = false;
      });

      // End set
      document.getElementById('end-set-btn').addEventListener('click', async function() {
        if (!liveSetId) return;
        try {
          await fetch('/api/sets/' + liveSetId + '/end', { method: 'POST', credentials: 'same-origin' });
          liveSetId = null;
          setLiveState(false);
          document.getElementById('current-set-tracks').innerHTML = '';
          await loadSetHistory();
        } catch (e) { console.error(e); }
      });

      // Track search for set
      var searchTimeout;
      document.getElementById('set-track-search').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        var q = this.value.trim();
        searchTimeout = setTimeout(async function() {
          if (q.length < 2) { document.getElementById('set-search-results').innerHTML = ''; return; }
          try {
            var res = await fetch('/api/tracks?q=' + encodeURIComponent(q) + '&limit=5');
            var data = await res.json();
            if (data.ok) renderSearchResults(data.tracks);
          } catch (e) {}
        }, 300);
      });

      function renderSearchResults(tracks) {
        var el = document.getElementById('set-search-results');
        el.innerHTML = tracks.map(function(t) {
          return '<div class="search-result" data-id="' + t.id + '"><div class="item-info"><div class="item-name">' + esc(t.name) + '</div><div class="item-sub">' + esc(t.artist) + '</div></div><div class="item-action"><button class="add-btn" data-testid="add-to-set-btn">Add</button></div></div>';
        }).join('');
        el.querySelectorAll('.add-btn').forEach(function(btn) {
          btn.addEventListener('click', function() { addTrackToSet(btn.closest('.search-result').dataset.id, btn); });
        });
      }

      async function addTrackToSet(trackId, btn) {
        if (!liveSetId) return;
        btn.disabled = true; btn.textContent = '...';
        try {
          await fetch('/api/sets/' + liveSetId + '/tracks', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
            body: JSON.stringify({ track_id: trackId }),
          });
          btn.textContent = 'Added';
          await refreshSetTracks();
        } catch (e) { btn.textContent = 'Add'; btn.disabled = false; }
      }

      async function refreshSetTracks() {
        try {
          var res = await fetch('/dj/' + contributor.id + '/live');
          var data = await res.json();
          if (data.ok && data.live_set) renderSetTracks(data.live_set.tracks || []);
        } catch (e) {}
      }

      function renderSetTracks(tracks) {
        var el = document.getElementById('current-set-tracks');
        if (tracks.length === 0) { el.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">No tracks yet. Search and add.</div>'; return; }
        el.innerHTML = tracks.map(function(t, i) {
          return '<div class="set-track"><div style="font-size:0.7rem;color:var(--text-muted);min-width:24px;">' + (tracks.length - i) + '</div><div class="item-info"><div class="item-name">' + esc(t.name) + '</div><div class="item-sub">' + esc(t.artist) + '</div></div></div>';
        }).join('');
      }

      async function loadSetHistory() {
        try {
          var res = await fetch('/dj/' + contributor.id + '/stats');
          var data = await res.json();
          // For now show set count — full history needs a dedicated endpoint
          var el = document.getElementById('set-history');
          var count = data.ok ? data.stats.total_sets : 0;
          el.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">' + count + ' sets played</div>';
        } catch (e) {}
      }

      function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    })();
  </script>
</body>
</html>
