<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Import</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #1DB954;
      --accent-hover: #1ed760;
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 { font-size: 1.25rem; font-weight: 700; }

    .user-badge {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(29, 185, 84, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* --- Loading --- */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 1rem; color: var(--text-muted); }

    /* --- Content --- */
    .content { padding: 20px 20px 100px; }

    /* --- Drop Zone --- */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(29, 185, 84, 0.05);
    }

    .drop-zone-icon { font-size: 2rem; }

    .drop-zone-text { font-size: 0.9rem; color: var(--text-muted); }

    .drop-zone-hint { font-size: 0.75rem; color: var(--text-muted); }

    .file-input { display: none; }

    .file-name {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 8px;
      word-break: break-all;
    }

    /* --- Preview Table --- */
    .preview-section {
      margin-top: 20px;
      display: none;
    }

    .preview-section.visible { display: block; }

    .preview-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .preview-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      scrollbar-width: none;
    }

    .preview-table-wrap::-webkit-scrollbar { display: none; }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    .preview-table th {
      background: var(--surface);
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    .preview-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* --- Upload Button --- */
    .upload-btn {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      min-height: 48px;
      transition: opacity 0.2s;
    }

    .upload-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* --- Progress --- */
    .progress-section {
      margin-top: 20px;
      display: none;
    }

    .progress-section.visible { display: block; }

    .progress-bar-wrap {
      background: var(--surface);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    /* --- Result --- */
    .result-section {
      margin-top: 20px;
      display: none;
    }

    .result-section.visible { display: block; }

    .result-success {
      background: rgba(29, 185, 84, 0.1);
      border: 1px solid rgba(29, 185, 84, 0.3);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }

    .result-success h3 {
      color: var(--accent);
      margin-bottom: 8px;
    }

    .result-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .result-error {
      background: rgba(255, 65, 54, 0.1);
      border: 1px solid rgba(255, 65, 54, 0.3);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-top: 12px;
    }

    .result-error h4 {
      color: #FF4136;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .error-list {
      list-style: none;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .error-list li {
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }

    .reset-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      min-height: 48px;
    }

    /* --- Access Denied --- */
    .access-denied {
      text-align: center;
      padding: 60px 20px;
    }

    .access-denied h3 { margin-bottom: 8px; }
    .access-denied p { color: var(--text-muted); font-size: 0.9rem; }

    /* --- Bottom Nav --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 env(safe-area-inset-bottom, 10px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 16px;
      transition: color 0.2s;
    }

    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- Loading -->
  <div id="loading-view" class="loading" data-testid="loading-view">
    <div class="spinner"></div>
    <div class="loading-text" data-testid="loading-text">Checking session...</div>
  </div>

  <!-- Access Denied -->
  <div id="access-denied" class="access-denied hidden" data-testid="access-denied">
    <h3>Import Restricted</h3>
    <p>Only founders and curators can import music libraries.</p>
  </div>

  <!-- Import View -->
  <div id="import-view" class="hidden" data-testid="import-view">
    <div class="header">
      <h1>Import Library</h1>
      <span class="user-badge" id="user-badge" data-testid="user-badge"></span>
    </div>

    <div class="content">
      <!-- Drop Zone -->
      <div class="drop-zone" id="drop-zone" data-testid="drop-zone">
        <div class="drop-zone-icon">&#x1F4C1;</div>
        <div class="drop-zone-text">Tap to select a CSV file</div>
        <div class="drop-zone-hint">Or drag and drop on desktop</div>
        <div class="file-name hidden" id="file-name" data-testid="file-name"></div>
      </div>
      <input type="file" class="file-input" id="file-input" accept=".csv" data-testid="file-input">

      <!-- Preview -->
      <div class="preview-section" id="preview-section" data-testid="preview-section">
        <div class="preview-title">Preview</div>
        <div class="preview-table-wrap">
          <table class="preview-table" id="preview-table" data-testid="preview-table">
            <thead id="preview-thead"></thead>
            <tbody id="preview-tbody"></tbody>
          </table>
        </div>
        <div class="preview-count" id="preview-count" data-testid="preview-count"></div>
      </div>

      <!-- Upload Button -->
      <button class="upload-btn" id="upload-btn" disabled data-testid="upload-btn">Import Tracks</button>

      <!-- Progress -->
      <div class="progress-section" id="progress-section" data-testid="progress-section">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar" data-testid="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text" data-testid="progress-text">Uploading...</div>
      </div>

      <!-- Result -->
      <div class="result-section" id="result-section" data-testid="result-section">
        <div class="result-success" id="result-success" data-testid="result-success">
          <h3>Import Complete</h3>
          <div class="result-stats" id="result-stats" data-testid="result-stats"></div>
        </div>
        <div class="result-error hidden" id="result-error" data-testid="result-error">
          <h4>Errors</h4>
          <ul class="error-list" id="error-list" data-testid="error-list"></ul>
        </div>
        <button class="reset-btn" id="reset-btn" data-testid="reset-btn">Import Another File</button>
      </div>
    </div>

    <nav class="bottom-nav" data-testid="bottom-nav">
      <a href="/catalog" class="nav-item" data-testid="nav-catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>
        Catalog
      </a>
      <a href="/import" class="nav-item active" data-testid="nav-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        Import
      </a>
      <a href="/create" class="nav-item" data-testid="nav-create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Create
      </a>
    </nav>
  </div>

  <script>
    (function() {
      'use strict';

      var contributor = null;
      var csvFile = null;
      var csvRows = [];
      var csvHeaders = [];

      init();

      async function init() {
        try {
          var sessionRes = await fetch('/auth/session/me', { credentials: 'same-origin' });
          var sessionData = await sessionRes.json();

          if (!sessionData.ok) {
            window.location.href = '/?error=session_required';
            return;
          }

          contributor = sessionData.contributor;

          // Role check
          var allowedRoles = ['founder', 'curator'];
          if (!allowedRoles.includes(contributor.role)) {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('access-denied').classList.remove('hidden');
            return;
          }

          document.getElementById('user-badge').textContent = contributor.name;
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('import-view').classList.remove('hidden');
        } catch (err) {
          console.error('[WKRP] Import init error:', err);
          window.location.href = '/?error=session_required';
        }
      }

      // --- Drop Zone ---
      var dropZone = document.getElementById('drop-zone');
      var fileInput = document.getElementById('file-input');

      dropZone.addEventListener('click', function() {
        fileInput.click();
      });

      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        var files = e.dataTransfer.files;
        if (files.length > 0 && files[0].name.endsWith('.csv')) {
          handleFile(files[0]);
        }
      });

      fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) {
          handleFile(fileInput.files[0]);
        }
      });

      function handleFile(file) {
        csvFile = file;
        var fileNameEl = document.getElementById('file-name');
        fileNameEl.textContent = file.name + ' (' + formatBytes(file.size) + ')';
        fileNameEl.classList.remove('hidden');

        var reader = new FileReader();
        reader.onload = function(e) {
          parseAndPreview(e.target.result);
        };
        reader.readAsText(file);
      }

      function parseAndPreview(text) {
        var lines = text.split('\n').filter(function(l) { return l.trim().length > 0; });
        if (lines.length < 2) {
          alert('CSV file must have a header row and at least one data row.');
          return;
        }

        csvHeaders = parseCSVLine(lines[0]);
        csvRows = [];
        for (var i = 1; i < lines.length; i++) {
          csvRows.push(parseCSVLine(lines[i]));
        }

        // Show preview (first 5 rows, max 5 columns for mobile)
        var displayCols = Math.min(csvHeaders.length, 5);
        var thead = document.getElementById('preview-thead');
        thead.innerHTML = '<tr>' + csvHeaders.slice(0, displayCols).map(function(h) {
          return '<th>' + escapeHtml(h) + '</th>';
        }).join('') + (csvHeaders.length > 5 ? '<th>...</th>' : '') + '</tr>';

        var tbody = document.getElementById('preview-tbody');
        var previewRows = csvRows.slice(0, 5);
        tbody.innerHTML = previewRows.map(function(row) {
          return '<tr>' + row.slice(0, displayCols).map(function(cell) {
            return '<td>' + escapeHtml(cell) + '</td>';
          }).join('') + (csvHeaders.length > 5 ? '<td>...</td>' : '') + '</tr>';
        }).join('');

        document.getElementById('preview-count').textContent =
          csvRows.length + ' rows total' + (csvRows.length > 5 ? ' (showing first 5)' : '');

        document.getElementById('preview-section').classList.add('visible');
        document.getElementById('upload-btn').disabled = false;
      }

      function parseCSVLine(line) {
        var result = [];
        var current = '';
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
          var ch = line[i];
          if (ch === '"') {
            if (inQuotes && i + 1 < line.length && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      }

      // --- Upload ---
      document.getElementById('upload-btn').addEventListener('click', async function() {
        if (!csvFile || !contributor) return;

        var btn = document.getElementById('upload-btn');
        btn.disabled = true;
        btn.textContent = 'Importing...';

        var progressSection = document.getElementById('progress-section');
        progressSection.classList.add('visible');
        var progressBar = document.getElementById('progress-bar');
        var progressText = document.getElementById('progress-text');

        progressBar.style.width = '30%';
        progressText.textContent = 'Uploading CSV...';

        try {
          var res = await fetch('/import/' + contributor.id, {
            method: 'POST',
            headers: { 'Content-Type': 'text/csv' },
            body: csvFile,
            credentials: 'same-origin',
          });

          progressBar.style.width = '80%';
          progressText.textContent = 'Processing...';

          var data = await res.json();

          progressBar.style.width = '100%';

          setTimeout(function() {
            progressSection.classList.remove('visible');
            showResult(data);
          }, 500);
        } catch (err) {
          console.error('[WKRP] Import error:', err);
          progressSection.classList.remove('visible');
          showResult({ ok: false, error: 'Upload failed — please try again.' });
        }
      });

      function showResult(data) {
        var resultSection = document.getElementById('result-section');
        var resultSuccess = document.getElementById('result-success');
        var resultError = document.getElementById('result-error');
        var resultStats = document.getElementById('result-stats');

        if (data.ok) {
          var imp = data.import || {};
          resultStats.textContent =
            (imp.tracks_imported || 0) + ' tracks imported, ' +
            (imp.duplicates_skipped || 0) + ' duplicates skipped';
          resultSuccess.querySelector('h3').textContent = 'Import Complete';
        } else {
          resultStats.textContent = data.error || 'Import failed';
          resultSuccess.querySelector('h3').textContent = 'Import Failed';
          resultSuccess.style.borderColor = 'rgba(255, 65, 54, 0.3)';
          resultSuccess.style.background = 'rgba(255, 65, 54, 0.1)';
          resultSuccess.querySelector('h3').style.color = '#FF4136';
        }

        // Show errors if any
        if (data.errors && data.errors.length > 0) {
          var errorList = document.getElementById('error-list');
          errorList.innerHTML = data.errors.slice(0, 20).map(function(err) {
            return '<li>' + escapeHtml(err) + '</li>';
          }).join('');
          if (data.errors.length > 20) {
            errorList.innerHTML += '<li>...and ' + (data.errors.length - 20) + ' more</li>';
          }
          resultError.classList.remove('hidden');
        }

        resultSection.classList.add('visible');

        // Hide drop zone and preview
        document.getElementById('drop-zone').classList.add('hidden');
        document.getElementById('preview-section').classList.remove('visible');
        document.getElementById('upload-btn').classList.add('hidden');
      }

      // --- Reset ---
      document.getElementById('reset-btn').addEventListener('click', function() {
        csvFile = null;
        csvRows = [];
        csvHeaders = [];

        document.getElementById('file-input').value = '';
        document.getElementById('file-name').classList.add('hidden');
        document.getElementById('preview-section').classList.remove('visible');
        document.getElementById('result-section').classList.remove('visible');
        document.getElementById('result-error').classList.add('hidden');
        document.getElementById('drop-zone').classList.remove('hidden');
        document.getElementById('upload-btn').classList.remove('hidden');
        document.getElementById('upload-btn').disabled = true;
        document.getElementById('upload-btn').textContent = 'Import Tracks';

        var resultSuccess = document.getElementById('result-success');
        resultSuccess.style.borderColor = '';
        resultSuccess.style.background = '';
        resultSuccess.querySelector('h3').style.color = '';
      });

      // --- Helpers ---
      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }
    })();
  </script>
</body>
</html>
