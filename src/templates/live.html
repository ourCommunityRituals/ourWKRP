<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Live Set</title>
  <link rel="stylesheet" href="/ui.css">
  <style>
.dj-name{font-size:1.5rem;font-weight:700}.venue{font-size:.8rem;color:var(--text-muted);margin-top:6px}.live-track{border:1px solid var(--border);margin-bottom:8px}.live-track:first-of-type{border-color:var(--accent);background:rgba(23,133,251,.05)}
  </style>
</head>
<body>
  <div id="loading-view" class="loading" data-testid="loading-view">
    <div class="spinner"></div>
  </div>

  <div id="offline-view" class="offline-msg hidden" data-testid="offline-view">
    <h2>Not live right now</h2>
    <p id="offline-dj-name" data-testid="offline-dj-name"></p>
    <div style="margin-top:24px;">
      <a href="/catalog" style="color:var(--accent);text-decoration:none;">Browse the catalog</a>
    </div>
  </div>

  <div id="live-view" class="hidden" data-testid="live-view">
    <div class="live-view-header">
      <div class="dj-name" id="dj-name" data-testid="dj-name"></div>
      <div class="live-badge" data-testid="live-badge">Live</div>
      <div class="venue" id="venue" data-testid="venue"></div>
    </div>

    <div class="content">
      <div class="section-title">Set List</div>
      <div id="track-list" data-testid="track-list"></div>
    </div>

    <div class="footer-cta" id="footer-cta" data-testid="footer-cta">
      <a href="/" style="color:var(--accent);text-decoration:none;font-size:0.9rem;font-weight:500;" data-testid="join-link">Join the crew — save discoveries to your library</a>
      <div style="margin-top:8px;"><a href="/catalog" style="color:var(--text-muted);text-decoration:none;font-size:0.8rem;">or browse the catalog</a></div>
    </div>
  </div>

  <script nonce="__CSP_NONCE__">
    (function() {
      'use strict';

      var djId = window.location.pathname.split('/dj/')[1];
      if (djId) djId = djId.split('/')[0];
      if (!djId) return;

      var eventId = new URLSearchParams(window.location.search).get('event');
      var attributed = {};
      var isLoggedIn = false;

      // Check if logged in — update footer CTA and button states
      fetch('/auth/session/me', { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok && data.contributor) {
            isLoggedIn = true;
            var cta = document.getElementById('footer-cta');
            cta.innerHTML = '<a href="/catalog" style="color:var(--accent);text-decoration:none;font-size:0.9rem;">Back to your catalog</a>';
          }
        })
        .catch(function() {});

      loadLiveSet();

      async function loadLiveSet() {
        try {
          var res = await fetch('/dj/' + encodeURIComponent(djId) + '/live');
          var data = await res.json();

          document.getElementById('loading-view').classList.add('hidden');

          if (!data.ok || !data.live_set) {
            document.getElementById('offline-dj-name').textContent =
              data.dj ? data.dj.name + ' is not playing right now.' : 'DJ not found.';
            document.getElementById('offline-view').classList.remove('hidden');
            return;
          }

          document.getElementById('dj-name').textContent = data.dj.name;
          document.getElementById('venue').textContent = data.live_set.venue_name || '';

          renderTracks(data.live_set.tracks, data.dj.id, data.live_set.id);
          document.getElementById('live-view').classList.remove('hidden');

          // Poll every 15s for new tracks
          setInterval(function() { refreshTracks(data.dj.id); }, 15000);

        } catch (err) {
          console.error('[WKRP] Live set error:', err);
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('offline-dj-name').textContent = 'Something went wrong.';
          document.getElementById('offline-view').classList.remove('hidden');
        }
      }

      async function refreshTracks(currentDjId) {
        try {
          var res = await fetch('/dj/' + encodeURIComponent(currentDjId) + '/live');
          var data = await res.json();
          if (data.ok && data.live_set) {
            renderTracks(data.live_set.tracks, data.dj.id, data.live_set.id);
          }
        } catch (e) { /* silent */ }
      }

      function renderTracks(tracks, currentDjId) {
        var list = document.getElementById('track-list');
        list.innerHTML = tracks.map(function(t, i) {
          var isNowPlaying = i === 0;
          var isAttributed = attributed[t.id];
          return '<div class="track-card live-track" data-testid="track-card">' +
            (t.image_url ? '<img class="track-art" src="' + escapeHtml(t.image_url) + '" alt="" loading="lazy">' :
              '<div class="track-art"></div>') +
            '<div class="track-info">' +
              (isNowPlaying ? '<div class="now-playing-label">Now Playing</div>' : '') +
              '<div class="track-name">' + escapeHtml(t.name) + '</div>' +
              '<div class="track-artist">' + escapeHtml(t.artist) + '</div>' +
            '</div>' +
            '<button class="attr-btn' + (isAttributed ? ' done' : '') + (!isLoggedIn && !isAttributed ? ' needs-auth' : '') + '" ' +
              'data-track-id="' + t.id + '" data-dj-id="' + currentDjId + '" ' +
              (isAttributed ? 'disabled' : '') + ' data-testid="attr-btn">' +
              (isAttributed ? 'Saved' : (isLoggedIn ? 'This hit' : 'Save')) +
            '</button>' +
          '</div>';
        }).join('');

        // Attach handlers
        list.querySelectorAll('.attr-btn:not([disabled])').forEach(function(btn) {
          btn.addEventListener('click', function() {
            attributeTrack(btn.dataset.djId, btn.dataset.trackId, btn);
          });
        });
      }

      async function attributeTrack(djId, trackId, btn) {
        btn.disabled = true;
        btn.textContent = '...';
        try {
          var res = await fetch('/api/attributions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              dj_id: djId,
              track_id: trackId,
              event_id: eventId,
            }),
          });
          var data = await res.json();
          if (data.ok) {
            attributed[trackId] = true;
            btn.classList.add('done');

            // Show platform-specific feedback
            if (data.push && data.push.saved) {
              var label = data.push.platform === 'spotify' ? 'Saved to Spotify' :
                          data.push.platform === 'apple_music' ? 'Saved to Apple Music' : 'Saved';
              btn.textContent = label;
            } else if (!isLoggedIn) {
              btn.textContent = 'Noted';
              // Show join prompt after first anonymous attribution
              var cta = document.getElementById('footer-cta');
              cta.innerHTML = '<a href="/" style="color:var(--accent);text-decoration:none;font-size:0.9rem;font-weight:500;">Join to save songs to your library</a>' +
                '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">The DJ still got credit for this one</div>';
            } else {
              btn.textContent = 'Saved';
            }
          } else {
            btn.textContent = 'This hit';
            btn.disabled = false;
          }
        } catch (e) {
          btn.textContent = 'This hit';
          btn.disabled = false;
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
