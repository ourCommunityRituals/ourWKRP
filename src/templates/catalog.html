<!DOCTYPE html>
<html lang="en" data-brand="ow">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Catalog</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <!-- Loading State -->
  <div id="loading-view" class="loading" data-testid="loading-view">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text" data-testid="loading-text">Loading the catalog...</div>
    <div class="sync-status" id="sync-status" data-testid="sync-status"></div>
  </div>

  <!-- Catalog View -->
  <div id="catalog-view" class="hidden" data-testid="catalog-view">
    <div class="header header--stacked">
      <div class="header-top">
        <h1>ourWKRP</h1>
        <span class="user-badge" id="user-badge" data-testid="user-badge"></span>
      </div>
      <input
        type="search"
        class="search-bar"
        id="search-input"
        placeholder="Search tracks, artists, albums..."
        data-testid="search-input"
      >
    </div>

    <!-- Layer Toggle -->
    <div class="filter-row" id="layer-filters" data-testid="layer-filters" style="padding-bottom:4px;">
      <button class="filter-chip active" data-layer="all" data-testid="layer-all">All</button>
      <button class="filter-chip" data-layer="dj" data-testid="layer-dj" style="border-color:var(--accent);color:var(--text);">DJs</button>
      <button class="filter-chip" data-layer="crew" data-testid="layer-crew">Crew</button>
      <button class="filter-chip" data-layer="community" data-testid="layer-community">Community</button>
    </div>

    <div class="filter-row" data-testid="filters">
      <button class="filter-chip active" data-filter="all" data-testid="filter-all">All</button>
      <!-- Audio-feature chips stay hidden until /api/stats reports
           has_audio_features — without features they only return empty
           result sets. -->
      <span id="audio-feature-chips" class="feature-gated" data-testid="audio-feature-chips" hidden>
        <button class="filter-chip" data-filter="high-energy" data-testid="filter-energy">High Energy</button>
        <button class="filter-chip" data-filter="chill" data-testid="filter-chill">Chill</button>
        <button class="filter-chip" data-filter="happy" data-testid="filter-happy">Happy</button>
        <button class="filter-chip" data-filter="danceable" data-testid="filter-dance">Danceable</button>
        <button class="filter-chip" data-filter="acoustic" data-testid="filter-acoustic">Acoustic</button>
        <button class="filter-chip" data-filter="advanced" data-testid="filter-advanced">Filters</button>
      </span>
    </div>

    <div id="range-filters" class="range-filters" data-testid="range-filters" hidden>
      <div class="range-group">
        <label>Energy</label>
        <input type="range" id="energy-range" min="0" max="100" value="0" data-testid="range-energy">
        <span class="range-value" id="energy-value">0</span>
      </div>
      <div class="range-group">
        <label>Mood (Valence)</label>
        <input type="range" id="valence-range" min="0" max="100" value="0" data-testid="range-valence">
        <span class="range-value" id="valence-value">0</span>
      </div>
      <div class="range-group">
        <label>Danceability</label>
        <input type="range" id="dance-range" min="0" max="100" value="0" data-testid="range-dance">
        <span class="range-value" id="dance-value">0</span>
      </div>
    </div>

    <div class="toolbar" data-testid="toolbar">
      <div>
        <select class="sort-select" id="sort-select" data-testid="sort-select">
          <option value="default">Sort: Default</option>
          <option value="artist">Sort: Artist A-Z</option>
          <option value="title">Sort: Title A-Z</option>
          <option value="year-desc">Sort: Newest First</option>
          <option value="year-asc">Sort: Oldest First</option>
          <option value="energy-desc">Sort: Most Energy</option>
        </select>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="view-list" data-testid="view-list">List</button>
        <button class="view-btn" id="view-grid" data-testid="view-grid">Grid</button>
      </div>
    </div>

    <div class="track-list" id="track-list" data-testid="track-list">
      <div class="track-count" id="track-count" data-testid="track-count"></div>
      <!-- Tracks rendered here -->
    </div>

    <nav class="bottom-nav" data-testid="bottom-nav">
      <a href="/catalog" class="nav-item active" data-testid="nav-catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
        Catalog
      </a>
      <a href="/create" class="nav-item" data-testid="nav-create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Create
      </a>
      <a href="/import" class="nav-item" data-testid="nav-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        Import
      </a>
    </nav>
  </div>

  <!-- Genre Discovery Popup -->
  <div class="genre-popup-backdrop" id="genre-backdrop" data-testid="genre-backdrop"></div>
  <div class="genre-popup" id="genre-popup" data-testid="genre-popup">
    <div class="genre-popup-title" id="genre-popup-title"></div>
    <div class="genre-popup-links" id="genre-popup-links"></div>
    <button class="genre-filter-btn" id="genre-filter-btn" data-testid="genre-filter-btn">Filter catalog by this genre</button>
  </div>

  <script nonce="__CSP_NONCE__">
    (function() {
      'use strict';

      var currentCursor = null;
      var isLoading = false;
      var currentView = 'list';
      var currentLayer = 'all';
      var allLoadedTracks = [];
      var searchInput = document.getElementById('search-input');

      init();

      async function init() {
        try {
          document.getElementById('loading-text').textContent = 'Loading catalog...';

          // Try to load session info for badge + role-aware nav
          fetch('/auth/session/me', { credentials: 'same-origin' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.ok && data.contributor) {
                document.getElementById('user-badge').textContent = data.contributor.name;
                // Add DJ dashboard link if DJ role
                if (data.contributor.role === 'dj') {
                  var nav = document.querySelector('.bottom-nav');
                  var dashLink = document.createElement('a');
                  dashLink.href = '/dashboard';
                  dashLink.className = 'nav-item';
                  dashLink.setAttribute('data-testid', 'nav-dashboard');
                  dashLink.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"/></svg>Dashboard';
                  nav.appendChild(dashLink);
                }
              } else {
                document.getElementById('user-badge').textContent = 'Join';
                document.getElementById('user-badge').style.cursor = 'pointer';
                document.getElementById('user-badge').addEventListener('click', function() { window.location.href = '/'; });
              }
            })
            .catch(function() {});

          // Load stats
          fetch('/api/stats')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.ok) {
                document.getElementById('sync-status').textContent =
                  data.stats.total_tracks + ' tracks \u00B7 ' +
                  data.stats.total_contributors + ' contributors';
                // Only offer audio-feature filters when the catalog actually
                // has audio features to filter on.
                applyAudioFeatureGate(data.stats.has_audio_features === true);
              }
            })
            .catch(function() {});

          // Load initial tracks
          await fetchTracks();

        } catch (err) {
          console.error('[WKRP] Init error:', err);
          document.getElementById('loading-text').textContent = 'Something went wrong. Please try again.';
        }
      }

      // Audio-feature controls are only meaningful when the catalog has audio
      // features. Spotify refuses /audio-features to newer apps, so zero
      // features is a normal state, not an error — the controls stay hidden
      // rather than returning empty result sets.
      function applyAudioFeatureGate(hasFeatures) {
        var chips = document.getElementById('audio-feature-chips');
        var ranges = document.getElementById('range-filters');
        if (chips) chips.hidden = !hasFeatures;
        if (ranges) {
          ranges.hidden = !hasFeatures;
          if (!hasFeatures) ranges.classList.remove('visible');
        }
      }

      function buildApiUrl() {
        var params = new URLSearchParams();
        var query = searchInput.value.trim();
        if (query) params.set('q', query);

        var activeFilter = document.querySelector('.filter-chip.active:not([data-filter="advanced"])');
        var filter = activeFilter ? activeFilter.dataset.filter : 'all';

        // Preset filter chips map to API params
        if (filter === 'high-energy') params.set('energy_min', '0.7');
        else if (filter === 'chill') { params.set('energy_max', '0.4'); params.set('valence_max', '0.5'); }
        else if (filter === 'happy') params.set('valence_min', '0.7');
        else if (filter === 'danceable') params.set('danceability_min', '0.7');
        else if (filter === 'acoustic') params.set('energy_max', '0.3');

        // Range sliders (only apply if advanced filters visible and value > 0)
        var rangeVisible = document.getElementById('range-filters').classList.contains('visible');
        if (rangeVisible) {
          var energy = parseInt(document.getElementById('energy-range').value, 10);
          var valence = parseInt(document.getElementById('valence-range').value, 10);
          var dance = parseInt(document.getElementById('dance-range').value, 10);
          if (energy > 0) params.set('energy_min', (energy / 100).toFixed(2));
          if (valence > 0) params.set('valence_min', (valence / 100).toFixed(2));
          if (dance > 0) params.set('danceability_min', (dance / 100).toFixed(2));
        }

        if (currentLayer && currentLayer !== 'all') params.set('layer', currentLayer);
        if (currentCursor) params.set('cursor', currentCursor);

        return '/api/tracks?' + params.toString();
      }

      async function fetchTracks(append) {
        if (isLoading) return;
        isLoading = true;
        if (searchInput) searchInput.classList.add('loading');

        if (!append) {
          currentCursor = null;
          document.getElementById('track-list').innerHTML =
            '<div class="track-count" id="track-count" data-testid="track-count"></div>';
        }

        try {
          var res = await fetch(buildApiUrl());
          var data = await res.json();

          if (!data.ok) {
            console.error('[WKRP] API error:', data.error);
            isLoading = false;
            return;
          }

          // Show catalog view
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('catalog-view').classList.remove('hidden');

          var trackList = document.getElementById('track-list');

          if (!append && data.tracks.length === 0) {
            document.getElementById('track-count').textContent = 'No tracks found.';
            // Remove load-more if present
            var oldBtn = document.getElementById('load-more-btn');
            if (oldBtn) oldBtn.remove();
            isLoading = false;
            return;
          }

          if (!append) {
            document.getElementById('track-count').textContent = '';
          }

          // Render tracks
          var html = data.tracks.map(renderTrack).join('');
          if (append) {
            var oldLoadMore = document.getElementById('load-more-btn');
            if (oldLoadMore) oldLoadMore.remove();
          }
          trackList.insertAdjacentHTML('beforeend', html);

          // Load More button
          if (data.has_more && data.cursor) {
            currentCursor = data.cursor;
            var loadMoreHtml = '<button id="load-more-btn" class="filter-chip load-more" ' +
              'data-testid="load-more-btn">Load More</button>';
            trackList.insertAdjacentHTML('beforeend', loadMoreHtml);
            document.getElementById('load-more-btn').addEventListener('click', function() {
              fetchTracks(true);
            });
          } else {
            currentCursor = null;
          }
        } catch (err) {
          console.error('[WKRP] Fetch error:', err);
        }

        isLoading = false;
        if (searchInput) searchInput.classList.remove('loading');
      }

      // --- Search ---
      var searchTimeout;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() {
          fetchTracks();
        }, 300);
      });

      // --- Filter chips ---
      document.querySelectorAll('.filter-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          var filter = this.dataset.filter;

          if (filter === 'advanced') {
            document.getElementById('range-filters').classList.toggle('visible');
            this.classList.toggle('active');
            return;
          }

          document.querySelectorAll('.filter-chip:not([data-filter="advanced"])').forEach(function(c) {
            c.classList.remove('active');
          });
          this.classList.add('active');
          fetchTracks();
        });
      });

      // --- Layer toggle ---
      document.querySelectorAll('[data-layer]').forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.querySelectorAll('[data-layer]').forEach(function(c) { c.classList.remove('active'); });
          this.classList.add('active');
          currentLayer = this.dataset.layer;
          fetchTracks();
        });
      });

      // Load layer counts
      fetch('/api/layers')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            var l = data.layers;
            var fmt = function(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); };
            document.querySelector('[data-layer="all"]').textContent = 'All ' + fmt(l.all);
            document.querySelector('[data-layer="dj"]').textContent = 'DJs ' + fmt(l.dj);
            document.querySelector('[data-layer="crew"]').textContent = 'Crew ' + fmt(l.crew);
            document.querySelector('[data-layer="community"]').textContent = 'Community ' + fmt(l.community);
          }
        })
        .catch(function() {});

      // --- Range sliders ---
      var rangeTimeout;
      ['energy', 'valence', 'dance'].forEach(function(name) {
        var range = document.getElementById(name + '-range');
        var value = document.getElementById(name + '-value');
        if (range) {
          range.addEventListener('input', function() {
            value.textContent = this.value;
            clearTimeout(rangeTimeout);
            rangeTimeout = setTimeout(function() { fetchTracks(); }, 300);
          });
        }
      });

      function renderTrack(track) {
        var energyLevel = track.energy > 0.7 ? 'high' : '';
        var genreHtml = track.genre
          ? '<span class="genre-tag" data-genre="' + escapeHtml(track.genre) + '" data-testid="genre-tag">' + escapeHtml(track.genre) + '</span>'
          : '';
        return '<div class="track-card" data-testid="track-card">' +
          '<img class="track-art" src="' + sanitizeUrl(track.image_url) + '" alt="" loading="lazy">' +
          '<div class="track-info">' +
            '<div class="track-name">' + escapeHtml(track.name) + '</div>' +
            '<div class="track-artist">' + escapeHtml(track.artist) + ' ' + genreHtml + '</div>' +
          '</div>' +
          '<div class="track-meta">' +
            (track.energy !== null ? '<span class="meta-badge ' + energyLevel + '">' + Math.round(track.energy * 100) + '</span>' : '') +
          '</div>' +
        '</div>';
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function sanitizeUrl(url) {
        if (!url || typeof url !== 'string') return '';
        var trimmed = url.trim();
        if (trimmed.indexOf('https://') === 0 || trimmed.indexOf('http://') === 0) {
          return escapeHtml(trimmed);
        }
        return '';
      }

      // --- Genre Discovery Links ---
      var genrePopup = document.getElementById('genre-popup');
      var genreBackdrop = document.getElementById('genre-backdrop');
      var genrePopupTitle = document.getElementById('genre-popup-title');
      var genrePopupLinks = document.getElementById('genre-popup-links');
      var genreFilterBtn = document.getElementById('genre-filter-btn');
      var activeGenre = '';

      function openGenrePopup(genre) {
        activeGenre = genre;
        var slug = genre.toLowerCase().replace(/\s+/g, '+');
        var slugDash = genre.toLowerCase().replace(/\s+/g, '-');

        genrePopupTitle.textContent = genre;
        genrePopupLinks.innerHTML =
          '<a href="https://www.discogs.com/search/?genre_exact=' + encodeURIComponent(genre) + '" target="_blank" rel="noopener" class="genre-link" data-testid="genre-link-discogs">' +
            '<span class="genre-link-icon">&#x1F4BF;</span>' +
            '<div class="genre-link-info"><div class="genre-link-label">Discogs</div><div class="genre-link-desc">Labels, pressings, vinyl</div></div>' +
          '</a>' +
          '<a href="https://www.last.fm/tag/' + encodeURIComponent(slug) + '" target="_blank" rel="noopener" class="genre-link" data-testid="genre-link-lastfm">' +
            '<span class="genre-link-icon">&#x1F3B6;</span>' +
            '<div class="genre-link-info"><div class="genre-link-label">Last.fm</div><div class="genre-link-desc">Community tags, related artists</div></div>' +
          '</a>' +
          '<a href="https://everynoise.com/engenremap-' + encodeURIComponent(slugDash) + '.html" target="_blank" rel="noopener" class="genre-link" data-testid="genre-link-everynoise">' +
            '<span class="genre-link-icon">&#x1F30D;</span>' +
            '<div class="genre-link-info"><div class="genre-link-label">Every Noise</div><div class="genre-link-desc">Visual genre map</div></div>' +
          '</a>';

        genrePopup.classList.add('open');
        genreBackdrop.classList.add('open');
      }

      function closeGenrePopup() {
        genrePopup.classList.remove('open');
        genreBackdrop.classList.remove('open');
        activeGenre = '';
      }

      genreBackdrop.addEventListener('click', closeGenrePopup);

      genreFilterBtn.addEventListener('click', function() {
        if (activeGenre) {
          searchInput.value = activeGenre;
          closeGenrePopup();
          fetchTracks();
        }
      });

      // Delegate click on genre tags
      document.getElementById('track-list').addEventListener('click', function(e) {
        var tag = e.target.closest('.genre-tag');
        if (tag) {
          e.stopPropagation();
          openGenrePopup(tag.dataset.genre);
        }
      });
    })();
  </script>
</body>
</html>
