<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ourWKRP — Community Stats</title>
  <style>
    :root { --bg:#0a0a0a; --surface:#141414; --surface-hover:#1a1a1a; --border:#2a2a2a; --text:#f0f0f0; --text-muted:#888; --accent:#D4954B; --radius:12px; --radius-sm:8px; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100dvh; -webkit-font-smoothing:antialiased; }
    .header { position:sticky; top:0; z-index:10; background:rgba(10,10,10,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:16px 20px; text-align:center; }
    .header h1 { font-size:1.25rem; font-weight:700; }
    .header p { font-size:0.75rem; color:var(--text-muted); margin-top:4px; }
    .content { padding:20px 20px 100px; max-width:600px; margin:0 auto; }

    .big-stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
    .big-stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; }
    .big-stat-value { font-size:2rem; font-weight:700; color:var(--accent); }
    .big-stat-label { font-size:0.7rem; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.05em; }

    .section { margin-bottom:24px; }
    .section-title { font-size:0.8rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px; }

    .bar-chart { display:flex; flex-direction:column; gap:6px; }
    .bar-row { display:flex; align-items:center; gap:10px; }
    .bar-label { font-size:0.8rem; min-width:100px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bar-track { flex:1; height:24px; background:var(--surface); border-radius:4px; overflow:hidden; }
    .bar-fill { height:100%; background:var(--accent); border-radius:4px; transition:width 0.5s ease; }
    .bar-count { font-size:0.75rem; color:var(--text-muted); min-width:30px; text-align:right; }

    .contributor-item { display:flex; align-items:center; gap:12px; padding:10px; border-radius:var(--radius-sm); }
    .contributor-avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:0.9rem; font-weight:700; color:#000; flex-shrink:0; }
    .contributor-info { flex:1; }
    .contributor-name { font-size:0.85rem; font-weight:500; }
    .contributor-role { font-size:0.7rem; color:var(--text-muted); }
    .contributor-count { font-size:0.85rem; color:var(--accent); font-weight:600; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:10px 0 env(safe-area-inset-bottom, 10px); }
    .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.65rem; color:var(--text-muted); text-decoration:none; padding:6px 16px; }
    .nav-item.active { color:var(--accent); }
    .nav-item svg { width:22px; height:22px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Community Stats</h1>
    <p>The collective catalog, by the numbers</p>
  </div>

  <div class="content">
    <div class="big-stats" id="big-stats" data-testid="big-stats">
      <div class="big-stat"><div class="big-stat-value" id="total-tracks">—</div><div class="big-stat-label">Tracks</div></div>
      <div class="big-stat"><div class="big-stat-value" id="total-contributors">—</div><div class="big-stat-label">Contributors</div></div>
      <div class="big-stat"><div class="big-stat-value" id="total-playlists">—</div><div class="big-stat-label">Playlists</div></div>
      <div class="big-stat"><div class="big-stat-value" id="total-attributions">—</div><div class="big-stat-label">DJ Attributions</div></div>
    </div>

    <div class="section" data-testid="top-genres-section">
      <div class="section-title">Top Genres</div>
      <div class="bar-chart" id="top-genres" data-testid="top-genres"></div>
    </div>

    <div class="section" data-testid="top-decades-section">
      <div class="section-title">By Decade</div>
      <div class="bar-chart" id="top-decades" data-testid="top-decades"></div>
    </div>

    <div class="section" data-testid="layers-section">
      <div class="section-title">Catalog Layers</div>
      <div id="layer-bars" data-testid="layer-bars" class="bar-chart"></div>
    </div>

    <div class="section" data-testid="mood-section">
      <div class="section-title">Catalog Mood</div>
      <div id="mood-grid" data-testid="mood-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"></div>
    </div>

    <div class="section" data-testid="top-contributors-section">
      <div class="section-title">Most Active Contributors</div>
      <div id="top-contributors" data-testid="top-contributors"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/catalog" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>Catalog</a>
    <a href="/stats" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Stats</a>
    <a href="/create" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Create</a>
  </nav>

  <script>
    (function() {
      'use strict';
      Promise.all([
        fetch('/api/stats').then(function(r) { return r.json(); }),
        fetch('/api/contributors').then(function(r) { return r.json(); }),
      ]).then(function(results) {
        var statsData = results[0];
        var contribData = results[1];

        if (statsData.ok) {
          var s = statsData.stats;
          document.getElementById('total-tracks').textContent = s.total_tracks.toLocaleString();
          document.getElementById('total-contributors').textContent = s.total_contributors.toLocaleString();
          document.getElementById('total-playlists').textContent = s.total_playlists.toLocaleString();
          renderBarChart('top-genres', s.top_genres || [], 'genre');
          renderBarChart('top-decades', s.top_decades || [], 'decade');
        }

        if (contribData.ok) {
          renderContributors(contribData.contributors || []);
        }

        document.getElementById('total-attributions').textContent = '0';

        // Load layer breakdown
        fetch('/api/layers').then(function(r) { return r.json(); }).then(function(ld) {
          if (ld.ok) {
            var l = ld.layers;
            var layerMax = Math.max(l.dj, l.crew, l.community, 1);
            var layers = [
              { label: 'DJ Sets', count: l.dj, color: 'var(--accent)' },
              { label: 'Crew (Founders + Curators)', count: l.crew, color: '#7B8794' },
              { label: 'Community', count: l.community, color: '#4A5568' },
            ];
            document.getElementById('layer-bars').innerHTML = layers.map(function(item) {
              var pct = Math.round((item.count / layerMax) * 100);
              return '<div class="bar-row">' +
                '<div class="bar-label">' + item.label + '</div>' +
                '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + item.color + '"></div></div>' +
                '<div class="bar-count">' + item.count + '</div></div>';
            }).join('');
          }
        }).catch(function() {});

        // Load mood data from a sample of tracks
        fetch('/api/tracks?limit=100').then(function(r) { return r.json(); }).then(function(td) {
          if (td.ok && td.tracks.length > 0) {
            var tracks = td.tracks;
            var avgEnergy = 0, avgValence = 0, avgDance = 0, count = 0;
            tracks.forEach(function(t) {
              if (t.energy !== null) { avgEnergy += t.energy; avgValence += (t.valence || 0); avgDance += (t.danceability || 0); count++; }
            });
            if (count > 0) {
              avgEnergy = Math.round((avgEnergy / count) * 100);
              avgValence = Math.round((avgValence / count) * 100);
              avgDance = Math.round((avgDance / count) * 100);
            }

            var moodCards = [
              { label: 'Energy', value: avgEnergy, desc: avgEnergy > 60 ? 'High energy catalog' : avgEnergy > 30 ? 'Balanced energy' : 'Chill vibes' },
              { label: 'Mood', value: avgValence, desc: avgValence > 60 ? 'Upbeat feel' : avgValence > 30 ? 'Mixed mood' : 'Darker tones' },
              { label: 'Danceability', value: avgDance, desc: avgDance > 60 ? 'Dance-heavy' : avgDance > 30 ? 'Mixed' : 'Sit-down music' },
              { label: 'Tracks Sampled', value: count, desc: 'with audio features' },
            ];

            document.getElementById('mood-grid').innerHTML = moodCards.map(function(m) {
              return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;">' +
                '<div style="font-size:1.25rem;font-weight:700;color:var(--accent);">' + m.value + (m.label !== 'Tracks Sampled' ? '%' : '') + '</div>' +
                '<div style="font-size:0.75rem;font-weight:600;margin-top:4px;">' + m.label + '</div>' +
                '<div style="font-size:0.65rem;color:var(--text-muted);margin-top:2px;">' + m.desc + '</div>' +
              '</div>';
            }).join('');
          }
        }).catch(function() {});
      });

      function renderBarChart(containerId, items, labelKey) {
        var el = document.getElementById(containerId);
        if (items.length === 0) { el.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">No data yet</div>'; return; }
        var max = Math.max.apply(null, items.map(function(i) { return i.count; }));
        el.innerHTML = items.map(function(item) {
          var pct = max > 0 ? Math.round((item.count / max) * 100) : 0;
          var label = item[labelKey] || 'Unknown';
          if (labelKey === 'decade' && label) label = label + 's';
          return '<div class="bar-row">' +
            '<div class="bar-label">' + esc(String(label)) + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="bar-count">' + item.count + '</div></div>';
        }).join('');
      }

      function renderContributors(contributors) {
        var sorted = contributors.slice().sort(function(a, b) { return (b.track_count || 0) - (a.track_count || 0); }).slice(0, 10);
        var el = document.getElementById('top-contributors');
        if (sorted.length === 0) { el.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">No contributors yet</div>'; return; }
        el.innerHTML = sorted.map(function(c) {
          return '<a href="/contributor/' + c.id + '" class="contributor-item" style="text-decoration:none;color:inherit;">' +
            '<div class="contributor-avatar">' + esc(c.name.charAt(0).toUpperCase()) + '</div>' +
            '<div class="contributor-info"><div class="contributor-name">' + esc(c.name) + '</div>' +
            '<div class="contributor-role">' + esc(c.role) + ' / ' + esc(c.generation) + '</div></div>' +
            '<div class="contributor-count">' + (c.track_count || 0) + '</div></a>';
        }).join('');
      }

      function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    })();
  </script>
</body>
</html>
