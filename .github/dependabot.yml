# Keeps every pinned action current (OW-228). Workflows pin actions by full
# commit SHA with the tag as a comment; Dependabot proposes the new SHA when the
# tag moves, so a pin is updated by a reviewed PR, never by a moved tag.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a hijacked or broken
    # release has time to be caught upstream (CCR F5; action-pinning spec).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
