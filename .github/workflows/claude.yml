name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Security gate (CCR / OSE-1107): these events carry repo secrets AND feed
    # untrusted comment/issue text into an LLM agent with tools. Restrict the
    # trigger to TRUSTED actors only — author_association must be OWNER / MEMBER /
    # COLLABORATOR. Untrusted `@claude` mentions (CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR
    # / NONE) are ignored → closes the prompt-injection + API-spend-DoS surface.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `id-token: write` stays here on purpose (OW-227): @claude tag mode answers by
    # commenting and pushing through the Claude GitHub App, which the action reaches
    # by trading this OIDC token. That app token is not bounded by this block, so
    # the guards are the trusted-actor `if:` above, the pinned action, and
    # `--setting-sources user` below. The PR review workflow does not need
    # the app and has no id-token.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        with:
          # Auth = service-account API key (interim). Federation on-ramp (OSE-1109):
          # `id-token: write` is already granted above, so moving to Workload Identity
          # Federation later = add ANTHROPIC_FEDERATION_RULE_ID + ANTHROPIC_ORGANIZATION_ID
          # + ANTHROPIC_SERVICE_ACCOUNT_ID + the OIDC token, and DELETE the
          # ANTHROPIC_API_KEY secret (even empty, it shadows federation — precedence).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
          #
          # `--setting-sources user` (OW-227, sweep H1): on a PR the action checks out
          # the PR branch itself, so a .claude/settings.json hook added on that branch
          # would otherwise run inside this job next to the API key and the app token.
          # Loading user settings only means no in-repo settings, hooks or CLAUDE.md
          # are read here; give @claude the context it needs in the comment.
          claude_args: '--setting-sources user'

