name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Event-scoped concurrency (adopted from OSE claude-review.yml — the OSE-888 fix).
# Without github.event_name in the group, a rapid run of a different event could land
# in the same group and cancel-in-progress would cancel the REAL review (which then
# shows red while never having reviewed). Scoping by event de-dupes rapid pushes within
# the pull_request group without letting a different event cancel an in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # anthropics/claude-code-action's installer targets Linux/macOS (not Windows),
    # so this job pins ubuntu-24.04. (Self-hosted Windows pool retired 2026-09-02,
    # OSE-1194 — all CI now runs GitHub-hosted.)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Honest, not blocking. The review is a second opinion: it is not a required
    # check, so a red here never stops a merge. But it must never show green when
    # no review happened. The action step may fail without stopping the job, the
    # diagnosis step says why, and the last step turns the job red. Missing
    # federation settings skip with a notice.
    # Least privilege (OW-227). The action gets this job's own token
    # (github_token below), so it never trades for a Claude GitHub App token and
    # what it can do on GitHub is exactly what is listed here. pull-requests:
    # write lets the review post its comment.
    # `id-token: write` is for Claude API sign-in only (workload identity
    # federation): the action swaps a short-lived GitHub OIDC token for a
    # short-lived Claude API token. No API key is stored anywhere.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # Skip cleanly when federation is not set up yet, instead of failing the run.
      # The values are identifiers, not credentials (repository variables).
      - name: Check Claude sign-in settings
        id: check-key
        env:
          HAS_RULE: ${{ vars.ANTHROPIC_WIF_RULE_PR != '' && vars.ANTHROPIC_ORGANIZATION_ID != '' }}
        run: |
          if [ "$HAS_RULE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude sign-in (ANTHROPIC_WIF_RULE_PR, ANTHROPIC_ORGANIZATION_ID) not configured — skipping Claude review"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-key.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A PR must not rewrite its own reviewer (OW-227, sweep H1; same rule as
      # ourSharedEvents claude-review.yml). Claude Code loads CLAUDE.md, AGENTS.md
      # and .claude/ (settings, hooks, skills, agents) from the working tree, and
      # claude-code-action loads project settings by default, so a hook added on
      # the PR branch would run inside this job next to its Claude sign-in. These come
      # from the BASE branch instead; the PR's changes to them are still reviewed
      # through the diff. The repo is public, so this fetch needs no token.
      - name: Reviewer instructions from base branch
        if: steps.check-key.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          rm -rf .claude AGENTS.md CLAUDE.md .mcp.json
          for p in .claude AGENTS.md CLAUDE.md .mcp.json; do
            if [ -n "$(git ls-tree --name-only "origin/${BASE_REF}" -- "${p}")" ]; then
              git checkout "origin/${BASE_REF}" -- "${p}"
            fi
          done
          echo "Instructions in use (from origin/${BASE_REF}):"
          ls -d .claude AGENTS.md CLAUDE.md .mcp.json 2>/dev/null || true

      - name: Run Claude Code Review
        id: claude-review
        if: steps.check-key.outputs.skip != 'true'
        continue-on-error: true # advisory — API/model failures must not block PRs
        # SHA-pinned (supply-chain hardening): a mutable @v1 tag can be force-pushed to
        # run attacker code with this job's Claude sign-in. Pin to the commit @v1
        # resolved to; bump via Dependabot.
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1
        with:
          # Auth = workload identity federation (OSE-1109). No stored key: never add
          # anthropic_api_key or claude_code_oauth_token here, since either one
          # silently takes precedence over federation.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_WIF_RULE_PR }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          # This job's own token, bounded by `permissions:` (OW-227).
          github_token: ${{ github.token }}
          # A reviewed, vendored copy (CCR F11), restored from the base branch
          # with the rest of .claude/ above. See .claude/review-marketplace/UPSTREAM.md.
          plugin_marketplaces: './.claude/review-marketplace'
          plugins: 'code-review@ourwkrp-review'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Pin the model explicitly. Previously unpinned → rode claude-code-action's
          # rolling default, which resolved to a nonexistent model id and returned
          # is_error with zero token usage (a hard red on a healthy PR). A current,
          # non-dated alias avoids BOTH the rolling default and OSE's dated-id
          # retirement trap. Owner may bump to claude-opus-4-8 for higher review quality.
          # Tools are an allowlist (OW-227): read the code and the PR, post the
          # review. No edits, no other shell, no network tools.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Task,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

      # The review step is advisory, so a refused run used to look green
      # (sweep 2026-11-25: is_error, zero tokens, 0.2 s on every PR). When it
      # fails, try the federation sign-in once by hand, then one tiny request with
      # the same model, and print only the HTTP status and the API's error type
      # and message, never a token.
      - name: Why the review failed (sign-in, credit or model)
        if: steps.claude-review.outcome == 'failure'
        env:
          RULE_ID: ${{ vars.ANTHROPIC_WIF_RULE_PR }}
          ORG_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          MODEL: claude-sonnet-4-6
        run: bash scripts/ci/claude-wif-probe.sh
      # The check goes red when the review did not run (see the job comment).
      # Locked by tests/security/claude-workflow-hardening.invariant.spec.ts.
      - name: Fail when the review did not run
        if: steps.claude-review.outcome == 'failure'
        run: |
          echo "::error title=Claude review did not run::No review was produced for this PR. See the step above for the API's answer."
          exit 1
