name: Brain contract check

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

# bash is the default shell on ubuntu-24.04; kept explicit for clarity.
defaults:
  run:
    shell: bash

jobs:
  contract-check:
    name: Validate against OCR-docs brain
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout WKRP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wkrp
          persist-credentials: false

      # Dependabot PRs and fork PRs do not receive Actions secrets, so
      # OCR_HUB_READ is empty there and the checkout below would stop with
      # "Input required and not supplied: token". Name that cause instead.
      # The job still fails: a check that cannot read the brain has not passed.
      - name: Check the brain read token is available
        env:
          HAS_TOKEN: ${{ secrets.OCR_HUB_READ != '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
              echo "::error title=Brain token missing::OCR_HUB_READ is not available to Dependabot runs. Add it as a Dependabot secret (Settings > Secrets and variables > Dependabot), then re-run this check."
            else
              echo "::error title=Brain token missing::OCR_HUB_READ is not available to this run (fork PR, or the secret is unset), so the OCR-docs brain cannot be read."
            fi
            exit 1
          fi

      - name: Checkout OCR-docs brain (read-only)
        id: brain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ourCommunityRituals/OCR-docs
          path: ocr-docs
          ref: main
          # Full history, so the pin step can prove the pin is on main.
          fetch-depth: 0
          token: ${{ secrets.OCR_HUB_READ }}
          # The token is used for this fetch only and never written into
          # ocr-docs/.git/config (OCR-230 sweep L1; OW CLAUDE.md "transient").
          persist-credentials: false

      # The brain is read at the commit in .ocr-brain-ref, not at OCR-docs main
      # (CCR F3). The pin must be on main and may not move back from the base
      # branch's pin. A brain change reaches WKRP through a PR that bumps it.
      - name: Move the brain to the pinned commit
        id: brain-pin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_pin=""
          if [ -n "$BASE_REF" ]; then
            git -C wkrp fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
            base_pin="$(git -C wkrp show FETCH_HEAD:.ocr-brain-ref 2>/dev/null | tr -d '[:space:]' || true)"
          fi
          bash wkrp/scripts/ci/brain-pin.sh ocr-docs wkrp/.ocr-brain-ref "$base_pin"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml==6.0.2 packaging==24.2

      # The brain test pyramid validates the OCR-docs brain repo itself. A
      # failure there is upstream debt, not WKRP drift, and must not block WKRP
      # PRs — the real gate for this repo is the WKRP conformance step below.
      - name: Run brain test pyramid
        id: brain-pyramid
        continue-on-error: true
        working-directory: ocr-docs/ocr-docs-brain
        run: python3 tests/run_all.py

      # Invariant #22 (Cross-Repo Import Isolation) — WKRP side (OSE-1288 / F13).
      # Runs the canonical, live-read brain guard (#22 enforcement_kind:
      # brain_script) against WKRP source. Wiring this step is what brain
      # conformance verifies for product wkrp; it also lets the enforcement_mode
      # plane flip wkrp warn→block (one reviewed brain edit) now that WKRP carries
      # its side of the seam.
      - name: Invariant #22 — cross-repo isolation gate (live-read brain guard, OSE-1288)
        working-directory: ${{ github.workspace }}
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/check_cross_repo_imports.py \
            --repo wkrp --product-id wkrp --brain ocr-docs/ocr-docs-brain

      - name: Run WKRP contract conformance
        id: conformance
        working-directory: ${{ github.workspace }}
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/check_brain_contract.py \
            --brain ocr-docs/ocr-docs-brain \
            --repo wkrp \
            --product-id wkrp \
            --report-path conformance-report.json

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report
          path: conformance-report.json

      # Only real drift opens a ticket: the brain must have been checked out
      # and the conformance step must have run and failed.
      - name: Open Linear ticket on drift
        id: ticket
        if: >-
          failure() && github.event_name == 'pull_request' &&
          steps.brain.outcome == 'success' && steps.conformance.outcome == 'failure'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/open_drift_ticket.py \
            --report conformance-report.json \
            --repo "$REPO_NAME" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --pr-author "$PR_AUTHOR" \
            --commit "$COMMIT_SHA"

      - name: Comment on PR with drift summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRAIN_OUTCOME: ${{ steps.brain.outcome }}
          TICKET_OUTCOME: ${{ steps.ticket.outcome }}
        with:
          script: |
            const fs = require('fs');
            const brainRead = process.env.BRAIN_OUTCOME === 'success';
            const ticketOpened = process.env.TICKET_OUTCOME === 'success';
            let body;
            if (!brainRead) {
              // Nothing was compared, so this is not drift: say what stopped it.
              body = [
                '### Brain contract check could not run',
                '',
                'The OCR-docs brain could not be checked out, so WKRP was not compared against it. This is not drift.',
                '',
                'Usual cause: the `OCR_HUB_READ` secret is not available to this run. Dependabot PRs need it added as a Dependabot secret; fork PRs never receive it.',
                '',
                'No Linear ticket was opened.',
              ].join('\n');
            } else {
              let report;
              try {
                report = JSON.parse(fs.readFileSync('conformance-report.json', 'utf8'));
              } catch (e) {
                report = { failures: [{ check: 'report missing', detail: e.message }] };
              }
              const failures = report.failures || [];
              body = [
                '### Brain contract check failed',
                '',
                'The WKRP code drifted from the OCR-docs governance brain.',
                '',
                `Failures: **${failures.length}**`,
                '',
                ...failures.slice(0, 10).map(f => `- \`${f.check}\` — ${f.detail}`),
                failures.length > 10 ? `- ... and ${failures.length - 10} more` : '',
                '',
                ticketOpened
                  ? 'A Linear ticket has been opened. Resolve the drift or update the brain via a PR to `ourCommunityRituals/OCR-docs`.'
                  : 'No Linear ticket was opened (the ticket step did not run or did not succeed; see the job log). Resolve the drift or update the brain via a PR to `ourCommunityRituals/OCR-docs`.',
              ].filter(Boolean).join('\n');
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
