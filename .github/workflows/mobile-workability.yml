# ourWKRP — Mobile Workability Audit
#
# Enforces .ocr-standards/standards/OCR_STANDARD_mobileWorkability.md: every
# customer-facing surface must be usable at a 375x812 viewport.
#
# Per the standard, the audit is INFORMATIONAL on pull_request / push and
# BLOCKING on the nightly schedule + manual dispatch. It runs separately from
# ci.yml and is not part of the all-checks deploy gate.

name: Mobile Workability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC nightly
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  mobile-workability:
    name: Mobile Workability Audit (375x812)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      # wrangler dev bundles @ocr/ui (/ui.css), so the pinned hub package must
      # be staged first, exactly as ci.yml does (OW-151).
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      # The Ubuntu packages `--with-deps` installs for WebKit (181 packages,
      # 126 MB) come from the runner's mirror (azure.archive.ubuntu.com). On
      # 2026-10-08 that mirror stalled this step for 25 minutes on OW-158's PR
      # (run 37819813838) before any test ran. The script below copies this
      # cache into apt's own, limits each download attempt, drops the slow
      # mirror for the next one, and refreshes the cache after. Ported from
      # ourSharedEvents scripts/ci/install-playwright-browsers.sh (#862).
      - name: Restore Playwright system package cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pw-apt-archives
          key: ${{ runner.os }}-pw-apt-chromium-webkit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-apt-chromium-webkit-
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bash scripts/ci/install-playwright-browsers.sh chromium webkit
      - name: Audit customer-facing surfaces
        # Informational on PR/push; blocking on schedule + manual dispatch.
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: npm run test:mobile-workability
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-workability-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
