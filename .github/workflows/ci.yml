name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Pin bash for self-hosted Windows runner. Default would be PowerShell;
# every `run:` step in this file uses bash syntax (grep negation, pipes,
# POSIX conditionals) and would otherwise fail with parser errors.
defaults:
  run:
    shell: bash

jobs:
  # ============================================
  # Stage 1: Static Analysis (parallel)
  # ============================================

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  secret-scanning:
    name: Secret Scanning
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Drops the prior gitleaks-based scan. gitleaks ships a Linux-only
      # binary; the self-hosted Windows runner can't execute it and the
      # `sudo mv /usr/local/bin/` line fails on Windows regardless.
      # Replaced with the vendored canonical security gate — same class
      # of scan (secret + PII + forbidden-URL) + pragma policy audit,
      # shared across OCR-docs, OSE, @ocr/flags, and now OW.
      - name: Level 0 Security
        run: py tests/level0_security.py

  dependency-audit:
    name: Dependency Audit
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Zero runtime deps — all vulnerabilities are in dev tooling (esbuild, vite, miniflare).
      # Fail on critical only. High/moderate in dev deps are informational.
      - name: Audit dependencies
        run: |
          npm audit --audit-level=critical || exit 1
          npm audit --audit-level=high || echo "::warning::Dev dependency vulnerabilities found (non-blocking). Run npm audit for details."
      # Also check for known vulnerable patterns in our code
      - name: Check for dangerous patterns
        run: |
          echo "Checking for eval(), innerHTML, document.write..."
          ! grep -rn 'eval(' src/ --include='*.ts' || true
          ! grep -rn '\.innerHTML\s*=' src/ --include='*.ts' || echo "WARNING: innerHTML assignment found in TypeScript"
          ! grep -rn 'document\.write' src/ --include='*.html' || echo "WARNING: document.write found in HTML"

  # ============================================
  # Stage 2: Test Pyramid (parallel, after lint)
  # ============================================

  unit-tests:
    name: Unit Tests
    runs-on: self-hosted
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: self-hosted
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  contract-tests:
    name: Contract Tests
    runs-on: self-hosted
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:contract

  security-tests:
    name: Security Tests
    runs-on: self-hosted
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:security

  # ============================================
  # Stage 3: Performance + Gate (after tests)
  # ============================================

  performance-tests:
    name: Performance Tests
    runs-on: self-hosted
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:performance

  # ============================================
  # Gate: ALL checks must pass before deploy
  # ============================================

  all-checks:
    name: All Checks Passed
    runs-on: self-hosted
    needs:
      - lint-and-typecheck
      - secret-scanning
      - dependency-audit
      - unit-tests
      - integration-tests
      - contract-tests
      - security-tests
      - performance-tests
    steps:
      - run: echo "All CI checks passed"

  # ============================================
  # Deploy jobs — Doppler injects secrets at runtime
  # ============================================
  # Setup: Doppler Dashboard > ourwkrp > Integrations > GitHub Actions
  #   1. Create service token for stg config → add as DOPPLER_TOKEN_STG secret in GitHub
  #   2. Create service token for prd config → add as DOPPLER_TOKEN_PRD secret in GitHub
  # ============================================

  deploy-staging:
    name: Deploy Staging
    runs-on: self-hosted
    needs: all-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Deploy to Staging
        run: doppler run -- wrangler deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-production:
    name: Deploy Production
    runs-on: self-hosted
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Deploy to Production
        run: doppler run -- wrangler deploy --env production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
