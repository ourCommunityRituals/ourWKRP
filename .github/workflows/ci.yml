# ourWKRP – CI Pipeline
#
# S0 Security → Stage 1 (parallel) → Stage 2 (parallel) → Stage 3 → Gate → Deploy
#
#   S0: Security — Static vulnerability analysis + supply chain inventory
#       - CodeQL SAST (JS/TS)          → github/codeql-action/analyze@v3
#       - npm audit (CVE check)        → npm audit --omit=dev --audit-level=critical
#       - SBOM generation              → npx @cyclonedx/cyclonedx-npm --omit dev
#
#   Stage 1: Static Analysis (parallel)
#       - Lint & typecheck             → tsc --noEmit + eslint src/
#       - Secret scanning              → py tests/level0_security.py
#
#   Stage 2: Test Pyramid (parallel, after Stage 1)
#       - Unit tests                   → vitest run tests/unit
#       - Integration tests            → vitest run tests/integration
#       - Contract tests               → vitest run tests/contract
#       - Security tests               → vitest run tests/security
#       - E2E tests                    → playwright test (mobile browsers)
#       - Postman API tests            → newman run (live wrangler dev)
#
#   Stage 3: Performance (after Stage 2)
#       - Performance tests            → vitest run tests/performance
#
#   Gate: All checks must pass → Deploy staging (automatic, on push to main)
#
#   Deploy production: MANUAL ONLY — workflow_dispatch. Policy is staging-only
#   until further notice; see the deploy-production job for the procedure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Production deploy is manual-only — triggered here. See the deploy-production job.
  workflow_dispatch:

# One run per PR (cancel previous on new push); one run per branch for push/dispatch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin bash for self-hosted Windows runner. Default would be PowerShell;
# every `run:` step in this file uses bash syntax (grep negation, pipes,
# POSIX conditionals) and would otherwise fail with parser errors.
defaults:
  run:
    shell: bash

jobs:
  # ============================================
  # S0: Security (before everything)
  # ============================================

  security:
    name: S0 Security
    runs-on: self-hosted
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

      - name: npm audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.json --output-format JSON --spec-version 1.5
          COMPONENT_COUNT=$(jq '.components | length' sbom.json 2>/dev/null || echo "unknown")
          echo "## S0 Security" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **npm audit:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM:** $COMPONENT_COUNT components (CycloneDX 1.5)" >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.json
          retention-days: 90

  # ============================================
  # Stage 1: Static Analysis (parallel)
  # ============================================

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: self-hosted
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint

  secret-scanning:
    name: Secret Scanning
    runs-on: self-hosted
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      # Vendored canonical security gate — secret + PII + forbidden-URL
      # + pragma policy audit, shared across OCR repos.
      - name: Level 0 Security
        run: py tests/level0_security.py

  # ============================================
  # Stage 2: Test Pyramid (parallel, after lint)
  # ============================================

  unit-tests:
    name: Unit Tests
    runs-on: self-hosted
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: self-hosted
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm run test:integration

  contract-tests:
    name: Contract Tests
    runs-on: self-hosted
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm run test:contract

  security-tests:
    name: Security Tests
    runs-on: self-hosted
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm run test:security

  e2e-tests:
    name: E2E Tests
    runs-on: self-hosted
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
      # playwright.config.ts boots `wrangler dev` itself via its webServer block.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

  postman-tests:
    name: Postman API Tests
    runs-on: self-hosted
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      # test:postman seeds the local D1, boots `wrangler dev`, then runs Newman.
      - run: npm run test:postman
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.run_number }}
          path: postman/newman-report.html
          retention-days: 14

  # ============================================
  # Stage 3: Performance + Gate (after tests)
  # ============================================

  performance-tests:
    name: Performance Tests
    runs-on: self-hosted
    needs: [security, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm run test:performance

  # ============================================
  # Gate: ALL checks must pass before deploy
  # ============================================

  all-checks:
    name: All Checks Passed
    runs-on: self-hosted
    needs:
      - security
      - lint-and-typecheck
      - secret-scanning
      - unit-tests
      - integration-tests
      - contract-tests
      - security-tests
      - e2e-tests
      - postman-tests
      - performance-tests
    steps:
      - run: echo "All CI checks passed"

  # ============================================
  # Deploy jobs — Doppler injects secrets at runtime
  # ============================================
  # Setup: Doppler Dashboard > ourwkrp > Integrations > GitHub Actions
  #   1. Create service token for stg config → add as DOPPLER_TOKEN_STG secret in GitHub
  #   2. Create service token for prd config → add as DOPPLER_TOKEN_PRD secret in GitHub
  # ============================================

  deploy-staging:
    name: Deploy Staging
    runs-on: self-hosted
    needs: all-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      # Doppler CLI is pre-installed on the self-hosted runner (on PATH).
      # dopplerhq/cli-action@v3 is deliberately NOT used — its installer fails
      # on the Windows runner: it downloads to an extension-less temp file and
      # PowerShell Expand-Archive rejects it (NotSupportedArchiveFileExtension).
      # wrangler is run via npx so it resolves from node_modules after npm ci.
      - name: Deploy to Staging
        run: doppler run -- npx wrangler deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ============================================
  # Deploy Production — MANUAL ONLY
  # ============================================
  # Policy: staging-only until further notice. Production does NOT deploy on a
  # push to main — this job runs only via a manual workflow_dispatch.
  #
  # Production deploy procedure (run only when prod is explicitly approved):
  #   1. Confirm staging is healthy:
  #        curl https://ourwkrp-staging.mzdano.workers.dev/health
  #   2. Apply D1 migrations to the production database — `wrangler deploy`
  #      does NOT apply migrations, so this must be done first:
  #        doppler run -c prd -- wrangler d1 migrations apply ourwkrp-production
  #   3. Trigger this workflow: GitHub → Actions → CI → "Run workflow" on the
  #      main branch. It re-runs the full gate (S0 → tests) then deploys prod.
  #   4. Smoke test:  curl https://ourwkrp.com/health
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: self-hosted
    needs: [all-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: ./.github/actions/setup-deps
        with:
          ocr-token: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      # Doppler CLI pre-installed on the runner; wrangler via npx — see the
      # deploy-staging note above.
      - name: Deploy to Production
        run: doppler run -- npx wrangler deploy --env production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
