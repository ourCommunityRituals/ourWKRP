# ourWKRP – CI Pipeline
#
# S0 Security → Stage 1 (parallel) → Stage 2 (parallel) → Stage 3 → Gate → Deploy
#
#   S0: Security — Static vulnerability analysis + supply chain inventory
#       - CodeQL SAST (JS/TS)          → github/codeql-action/analyze@v3
#       - npm audit (CVE check)        → npm audit --omit=dev --audit-level=high
#       - SBOM generation              → npx @cyclonedx/cyclonedx-npm --omit dev
#
#   Stage 1: Static Analysis (parallel)
#       - Lint & typecheck             → tsc --noEmit + eslint src/
#       - Secret scanning              → py tests/level0_security.py
#
#   Stage 2: Test Pyramid (parallel, after Stage 1)
#       - Unit tests                   → vitest run tests/unit
#       - Integration tests            → vitest run tests/integration
#       - Contract tests               → vitest run tests/contract
#       - Security tests               → vitest run tests/security
#       - E2E tests                    → playwright test (mobile browsers)
#       - Bruno API contract tests     → bru run (live wrangler dev)
#       - Fuzz / property tests        → vitest run tests/fuzz (fast-check)
#
#   Stage 3: Performance (after Stage 2)
#       - Performance tests            → vitest run tests/performance
#
#   Gate: All checks must pass → Deploy staging (automatic, on push to main)
#
#   Deploy is itself VERIFIED end-to-end, not a bare `wrangler deploy`:
#       preflight (wiring) → D1 migrations → deploy → smoke (controls live)
#       Missing security wiring or a dormant control FAILS the deploy. The same
#       chain runs locally via `npm run deploy:staging` (pre/post npm hooks), and
#       each step is runnable standalone (preflight:*, smoke:staging|prod).
#
#   Deploy production: MANUAL ONLY — workflow_dispatch. Policy is staging-only
#   until further notice; see the deploy-production job for the procedure.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  # Production deploy is manual-only — triggered here. See the deploy-production job.
  workflow_dispatch:

# bash is the default shell on ubuntu-latest; kept explicit so every `run:`
# step's bash syntax (grep negation, pipes, POSIX conditionals) is unambiguous.
defaults:
  run:
    shell: bash

# The @ocr/ui staging script (scripts/ci-stage-ocr-workspace.sh) fetches the
# private ourCommunityRituals hub at the commit pinned in .ocr-hub-ref (never a
# moving branch). OCR_PROPAGATE_TOKEN is passed ONLY to each staging step
# (step-scoped env) and used as a transient http.extraheader — never at
# workflow level, where every step (npm lifecycle scripts, tests, the dev
# server) could read it (OW-150, CCR OSE-1393 H2).

jobs:
  # ============================================
  # S0: Security (before everything)
  # ============================================

  security:
    name: S0 Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM
        run: |
          # --ignore-npm-errors: the staged @ocr/ui package declares build/peer
          # deps (react, typescript, vitest, tsx) that aren't in WKRP's lockfile
          # and aren't part of WKRP's shipped bundle, so `npm ls` reports them as
          # missing. The SBOM of WKRP's actual production deps is still complete.
          npx @cyclonedx/cyclonedx-npm --omit dev --ignore-npm-errors --output-file sbom.json --output-format JSON --spec-version 1.5
          COMPONENT_COUNT=$(jq '.components | length' sbom.json 2>/dev/null || echo "unknown")
          echo "## S0 Security" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **npm audit:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM:** $COMPONENT_COUNT components (CycloneDX 1.5)" >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.json
          retention-days: 90

  # ============================================
  # Stage 1: Static Analysis (parallel)
  # ============================================

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      # Blocking (ADR-008): WKRP may not grow its own tokens or stylesheet. The
      # checker is the hub's own, from the pinned commit in .ocr-hub-ref; the
      # baseline in .ocr-design-check.json may only shrink.
      # On PRs the baseline file itself is compared against the base branch's
      # copy (--base-config, OSE-1397): a PR may lower it, never raise it.
      - name: Design check (@ocr/ui — no spoke-local tokens or stylesheet)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ARGS=()
          if [ -n "$BASE_REF" ]; then
            git fetch -q --depth=1 origin "$BASE_REF"
            if git cat-file -e FETCH_HEAD:.ocr-design-check.json 2>/dev/null; then
              git show FETCH_HEAD:.ocr-design-check.json > "$RUNNER_TEMP/base-design-check.json"
              ARGS=(--base-config "$RUNNER_TEMP/base-design-check.json")
            fi
          fi
          node ../packages/ui/scripts/check-spoke-styles.mjs --root . "${ARGS[@]}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Tier-1 static preflight: validates manifest anchors exist in templates
      # without a browser. Catches manifest/template drift in seconds.
      - name: Smoke manifest preflight (static)
        run: WKRP_TPL=src/templates npx tsx --test tests/e2e/smoke/static-check.test.ts

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Vendored canonical security gate — secret + PII + forbidden-URL
      # + pragma policy audit, shared across OCR repos.
      - name: Level 0 Security
        run: python3 tests/level0_security.py

  # ============================================
  # Stage 2: Test Pyramid (parallel, after lint)
  # ============================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      - run: npm run test:integration

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      - run: npm run test:contract

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      - run: npm run test:security

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security, lint-and-typecheck]
    # Deterministic smoke-fixture ids (seeded by scripts/smoke-fixtures.sql) so
    # the Tier-1 /dj/:id, /dj/:id/poster and /contributor/:id surfaces run
    # instead of skipping. Both the smoke step and test:e2e inherit these.
    env:
      SMOKE_DJ_ID: '00000000-0000-4000-8000-0000000000d1'
      SMOKE_CONTRIBUTOR_ID: '00000000-0000-4000-8000-0000000000c0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # Seed schema + smoke fixtures into the local D1 the dev server reads, so
      # the Tier-1 smoke's fixture-gated surfaces have rows to render. (test:e2e
      # below re-seeds internally; INSERT OR IGNORE makes that a no-op.)
      - name: Seed local D1
        run: node scripts/seed-local-d1.mjs
      # Tier-1 page smoke: 9 surfaces, 8 assertions each, one mobile browser.
      # Runs before the Tier-2 journeys so a broken page surface fails fast.
      - name: Tier-1 page smoke
        # pw-guarded.sh (propagated from OSE PR #423 / OSE-852) counts discovery
        # before running: a positional path that falls outside the config's
        # testDir discovers zero tests and would otherwise exit green.
        env:
          SMOKE_APP: wkrp
          PW_LABEL: 'Tier-1 page smoke (wkrp)'
        run: bash scripts/pw-guarded.sh tests/e2e/smoke/tier1.spec.ts --project="Mobile Safari"
      # playwright.config.ts boots `wrangler dev` itself via its webServer block.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

  bruno-tests:
    name: Bruno API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      # `bru run --reporter-junit` EXITS non-zero if the target directory does
      # not exist — even when every assertion passes (mirrors OSE-1191). Make it
      # first so a green contract is never masked by a missing dir.
      - name: Prepare contract report dir
        run: mkdir -p .test-results
      # test:bruno seeds the local D1, boots `wrangler dev`, then runs `bru run`
      # against the bruno/wkrp-api contract collection (ex-Newman, OW: Newman → Bruno).
      - run: npm run test:bruno
      - name: Upload Bruno report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report-${{ github.run_number }}
          path: .test-results/bru-api-junit.xml
          retention-days: 14

  fuzz-tests:
    name: Fuzz / Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security, lint-and-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      # Property-based fuzzing (fast-check) over the untrusted input boundaries:
      # CSV parser, pagination cursors, catalog query-param sanitizers.
      - run: npm run test:fuzz

  # ============================================
  # Stage 3: Performance + Gate (after tests)
  # ============================================

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci
      - run: npm run test:performance

  # ============================================
  # Gate: ALL checks must pass before deploy
  # ============================================

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - security
      - lint-and-typecheck
      - secret-scanning
      - unit-tests
      - integration-tests
      - contract-tests
      - security-tests
      - e2e-tests
      - bruno-tests
      - fuzz-tests
      - performance-tests
    steps:
      - run: echo "All CI checks passed"

  # ============================================
  # Deploy jobs — Doppler injects secrets at runtime
  # ============================================
  # Setup: Doppler Dashboard > ourwkrp > Integrations > GitHub Actions
  #   1. Create service token for stg config → add as DOPPLER_TOKEN_STG secret in GitHub
  #   2. Create service token for prd config → add as DOPPLER_TOKEN_PRD secret in GitHub
  # ============================================

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: all-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci

      # Preflight: refuse to deploy if security wiring is missing from
      # wrangler.toml. Static, no secrets — the same gate the predeploy:* npm
      # hook runs locally, pulled into CI so the deploy path can't bypass it.
      - name: Preflight — security wiring present
        run: npm run preflight:staging

      # Doppler CLI is installed via the official action on ubuntu-latest.
      # (On the old Windows self-hosted runner it was pre-installed instead,
      # because dopplerhq/cli-action's installer failed there — Expand-Archive
      # rejected the extension-less temp download. On Linux the action works.)
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # wrangler deploy does NOT apply migrations — do it first, explicitly.
      # wrangler is run via npx so it resolves from node_modules after npm ci.
      # The DOPPLER_TOKEN service token already scopes project+config, so no -p/-c.
      - name: Apply D1 migrations (staging)
        run: doppler run -- npx wrangler d1 migrations apply ourwkrp-staging --remote
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Staging
        run: doppler run -- npx wrangler deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Runtime control-liveness proof (T3): hit the deployed Worker and assert
      # the controls actually FIRE — recognized rate-limiter backend, CSP nonce,
      # JSON script-src 'none', cross-origin 403, 429-under-burst. A dormant
      # control fails the deploy here, not silently in production. No secrets —
      # it only touches the public URL.
      - name: Smoke — prove controls are live (staging)
        run: npm run smoke:staging

  # ============================================
  # Deploy Production — MANUAL ONLY
  # ============================================
  # Policy: staging-only until further notice. Production does NOT deploy on a
  # push to main — this job runs only via a manual workflow_dispatch.
  #
  # Production deploy procedure (run only when prod is explicitly approved):
  #   1. Confirm staging is healthy:
  #        curl https://ourwkrp-staging.mzdano.workers.dev/health
  #   2. Trigger this workflow: GitHub → Actions → CI → "Run workflow" on the
  #      main branch. It re-runs the full gate (S0 → tests), then the verified
  #      deploy chain: preflight → D1 migrations → deploy → smoke. The job
  #      applies migrations and proves controls live itself — no manual steps.
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [all-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Stage @ocr/ui package
        run: bash scripts/ci-stage-ocr-workspace.sh
        env:
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      - run: npm ci

      - name: Preflight — security wiring present
        run: npm run preflight:prod

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # wrangler via npx — see the deploy-staging note above. The DOPPLER_TOKEN
      # service token scopes project+config, so no -p/-c flags.
      - name: Apply D1 migrations (production)
        run: doppler run -- npx wrangler d1 migrations apply ourwkrp-production --remote --env production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Production
        run: doppler run -- npx wrangler deploy --env production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke — prove controls are live (production)
        run: npm run smoke:prod
