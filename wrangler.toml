# ============================================
# ourWKRP — Cloudflare Worker Configuration
# ============================================
# Staging: doppler run -- wrangler deploy
# Production: doppler run -c prd -- wrangler deploy --env production
# Local dev: doppler run -c dev -- wrangler dev
# ============================================
# Secrets Management: Doppler (preferred)
#
# Doppler project: ourwkrp
# Configs: dev, stg, prd
#
# Doppler injects these as environment variables at runtime:
#   SPOTIFY_CLIENT_ID      → Spotify app client ID
#   SPOTIFY_REDIRECT_URI   → OAuth callback URL (per environment)
#   APP_URL                → Frontend base URL (per environment)
#
# Local dev setup:
#   doppler setup           → select ourwkrp project + dev config
#   doppler run -- wrangler dev
#
# The [vars] block below provides fallback defaults for local dev
# when Doppler is not available. Doppler env vars override these.
# ============================================

name = "ourwkrp-staging"
main = "src/index.ts"
compatibility_date = "2024-06-01"

# Import HTML templates as text strings
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# ============================================
# Default vars (overridden by Doppler at deploy time)
# ============================================
[vars]
WORKER_ENV = "staging"
WORKER_VERSION = "0.1.0"
# Fallback for local dev without Doppler — Doppler overrides in stg/prd
SPOTIFY_CLIENT_ID = "b0af039c67b14c2fbeb1f5ab0b5ff662"
SPOTIFY_REDIRECT_URI = "https://ourwkrp-staging.mzdano.workers.dev/auth/callback"
APP_URL = "https://ourwkrp-staging.mzdano.workers.dev"
# Last.fm — get API key at https://www.last.fm/api/account/create
LASTFM_API_KEY = ""
LASTFM_SHARED_SECRET = ""

# KV Namespace for auth/session state
[[kv_namespaces]]
binding = "WKRP_KV"
id = "aa9de79edebf4a1cac9a41a727ab85da"
preview_id = "103eb5aabbf745d9913073d8159518bc"

# D1 Database for catalog data
[[d1_databases]]
binding = "WKRP_DB"
database_name = "ourwkrp-staging"
database_id = "f2a3a785-8a43-47b3-8a06-5ad4125e2a6d"

# ============================================
# Durable Objects — atomic rate limiter (OW-79)
# ============================================
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# ============================================
# Cron triggers — audit retention purge (OW-83), 04:17 UTC daily
# ============================================
[triggers]
crons = ["17 4 * * *"]

# ============================================
# Production environment
# ============================================
[env.production]
name = "ourwkrp-production"
routes = [
  { pattern = "ourwkrp.com/*", zone_name = "ourwkrp.com" },
  { pattern = "www.ourwkrp.com/*", zone_name = "ourwkrp.com" },
  { pattern = "*.ourwkrp.com/*", zone_name = "ourwkrp.com" }
]

[env.production.vars]
WORKER_ENV = "production"
WORKER_VERSION = "0.1.0"
# Doppler (prd config) overrides these at deploy time
SPOTIFY_CLIENT_ID = ""
SPOTIFY_REDIRECT_URI = ""
APP_URL = ""
LASTFM_API_KEY = ""
LASTFM_SHARED_SECRET = ""

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[env.production.migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

[env.production.triggers]
crons = ["17 4 * * *"]

[[env.production.kv_namespaces]]
binding = "WKRP_KV"
id = "aa9de79edebf4a1cac9a41a727ab85da"

[[env.production.d1_databases]]
binding = "WKRP_DB"
database_name = "ourwkrp-production"
database_id = "3716b10e-a7b4-4869-b41e-bc7e422af749"

