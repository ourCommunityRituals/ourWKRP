# .github/workflows/docs-ci.yml
# Copy this file into any docs-as-code repo to enable CI.
# Calls the reusable workflow from OCR-docs.

name: Docs CI

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  pull_request:
    paths: ['**/*.md']

jobs:
  docs-check:
    uses: ourCommunityRituals/OCR-docs/.github/workflows/docs-ci.yml@main
    with:
      required_files: 'CLAUDE.md,README.md,SKILL.md'
