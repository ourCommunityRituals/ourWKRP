info:
  name: Get playlist
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/playlists/{{playlist_id}}"
  auth: inherit

docs:
  content: |-
    Get a playlist with its ordered tracks (by playlist UUID). If the id is a contributor UUID instead, returns that contributor's playlists.
  type: text/markdown

settings:
  encodeUrl: true
