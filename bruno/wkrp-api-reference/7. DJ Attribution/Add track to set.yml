info:
  name: Add track to set
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/sets/{{set_id}}/tracks"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Cookie
      value: "{{session_cookie}}"
  body:
    type: json
    data: |-
      {
        "track_id": "{{track_id}}"
      }
  auth: inherit

docs:
  content: |-
    The set's own DJ logs the song now playing. Closes the set's open playback
    event and opens a new one (a replay of the same song is a new event), on
    server time. Returns `{ ok, playback_event: { id } }`.
  type: text/markdown

settings:
  encodeUrl: true
