info:
  name: Export catalog
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/export/tracks?format=json"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
  auth: inherit

docs:
  content: |-
    Export the full catalog. Requires a curator/founder session. format=json (default) or format=csv.
  type: text/markdown

settings:
  encodeUrl: true
