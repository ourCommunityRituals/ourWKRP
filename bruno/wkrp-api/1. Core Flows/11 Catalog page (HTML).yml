info:
  name: 11 Catalog page (HTML)
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/catalog"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('status is 200', function () { expect(res.getStatus()).to.eql(200); });
        test('serves HTML', function () {
            expect(res.getHeader('Content-Type')).to.include('text/html');
        });

settings:
  encodeUrl: true
